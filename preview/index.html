/* ===================== الرمز السري ===================== */
function askPin(title, onOk, opts={}){
  let val='';
  const boxes=[0,1,2,3].map(()=>h('b',{}));
  const fb=h('p',{class:'small', style:'text-align:center;min-height:22px'},'');
  const draw=()=>boxes.forEach((b,i)=>{ b.textContent= i<val.length?'●':''; b.className= i===val.length?'on':''; });
  const keys=['1','2','3','4','5','6','7','8','9','⌫','0','✓'];
  const pad=h('div',{class:'keypad'}, ...keys.map(k=>h('button',{onclick:async()=>{
    if(k==='⌫'){ val=val.slice(0,-1); draw(); return; }
    if(k==='✓'){ return submit(); }
    if(val.length<4){ val+=k; draw(); if(val.length===4) submit(); }
  }}, k)));
  async function submit(){
    if (val.length<4){ fb.textContent='أدخل 4 أرقام'; return; }
    const hsh=await sha256(val);
    if (opts.setup){ closeSheet(); onOk(hsh, val); return; }
    if (S.settings && hsh===S.settings.pinHash){ closeSheet(); onOk(hsh); }
    else { fb.textContent='الرمز غير صحيح'; val=''; draw(); Log.ev({k:'pin_fail'}); }
  }
  openSheet(h('div',{class:'stack'}, h('h3',{}, title||'رَمْزُ بَابَا السِّرِّيّ 🔐'), h('div',{class:'pin'},...boxes), fb, pad,
    h('button',{class:'btn btn-ghost btn-sm', onclick:()=>{ closeSheet(); opts.onCancel && opts.onCancel(); }},'إلغاء')), {lock:true});
  draw();
}

/* ===================== الكتابة بالقلم (ورقة كتابة مستقلة) =====================
   - الورقة لها عرض منطقي ثابت (INK_W) وارتفاع محسوب من مكوّناتها، فتظهر الكتابة في مكانها نفسه على أي جهاز.
   - الكتابة تُحفظ كخطوط (نقاط) لا كصورة: تراجع، ممحاة، تكبير بدون تشويش، وعرض مطابق في لوحة بابا.
   - القلم فقط: بعد أول لمسة بقلم الآيباد تصير الأصابع للتحريك والتكبير فقط (رفض راحة اليد). */
const INK_W = 800, INK_LINE = 120, INK_PAD_T = 16, INK_PAD_B = 28;
const INK_COLORS = ['#1F3A8A', '#111827', '#C62828', '#2E7D32'];

/* ---------- حفظ الأعمال ---------- */
const Works = {
  key(id){ return 'ink_' + String(id).replace(/[^a-zA-Z0-9]+/g, '_'); },
  async load(id){ try{ return await Store.get(this.key(id)); }catch(e){ return Store.lget(this.key(id)); } },
  lru(k){ try{ let a = JSON.parse(localStorage.getItem(LSP+'inklru') || '[]').filter(x => x !== k); a.unshift(k); const max = S.mode === 'db' ? 25 : 60; a.splice(max).forEach(x => localStorage.removeItem(LSP + x)); localStorage.setItem(LSP+'inklru', JSON.stringify(a)); }catch(e){} },
  saveDoc(id, doc){ const k = this.key(id); const p = Store.set(k, doc); this.lru(k); return p; },
  index(id, doc){
    Child.ensure(); const W = S.child.works; const i = W.findIndex(w => w.id === id);
    const meta = { id, path: doc.path || '', label: doc.label || '', page: doc.page || '', ts: doc.ts, n: Ink.count(doc.strokes), pen: !!doc.pen };
    if (i >= 0) W.splice(i, 1); W.unshift(meta);
    W.splice(150).forEach(d => this.remove(d.id));
    return Child.save();
  },
  async remove(id){ const k = this.key(id); try{ localStorage.removeItem(LSP + k); }catch(e){} try{ if (Store.db) await Store.db.doc(Store.path(k)).delete(); }catch(e){ console.warn('ink delete', e); } }
};

/* ---------- مكوّنات الورقة ---------- */
function inkFit(text, maxW, base){ const n = stripT(N(String(text || ''))).length || 1; return Math.max(15, Math.min(base, Math.floor(maxW / (n * 0.56)))); }
function inkNoteRows(text){ return Math.max(1, Math.ceil(stripT(N(String(text || ''))).length / 44)); }
function inkBlockH(b){
  switch (b.t){
    case 'title': return 64;
    case 'note': return 16 + 40 * inkNoteRows(b.x);
    case 'model': return 96;
    case 'lines': return INK_LINE * (b.n || 1);
    case 'dict': return INK_LINE * b.w.length;
    case 'match': return 96 * Math.max(b.r.length, b.l.length);
    case 'circle': return 96 * Math.ceil(b.w.length / 4);
    case 'tick': return 60 + 78 * b.o.length;
    case 'gap': return b.h || 20;
    case 'pg': return kPgH(b);
  }
  return 0;
}
function inkSheetH(spec){ return INK_PAD_T + INK_PAD_B + spec.reduce((a, b) => a + inkBlockH(b), 0); }
function inkLineRow(extra, cls){ return h('div', { class: 'il-row ' + (cls || '') }, h('i', { class: 'il-mid' }), h('i', { class: 'il-base' }), extra || null); }
function inkBlockEl(b, opt){
  const hgt = inkBlockH(b); const st = `height:${hgt}px`;
  if (b.t === 'title') return h('div', { class: 'ib ib-title', style: st + `;font-size:${inkFit(b.x, 740, 34)}px` }, N(b.x));
  if (b.t === 'note') return h('div', { class: 'ib ib-note', style: st }, N(b.x));
  if (b.t === 'model') return h('div', { class: 'ib ib-model', style: st + `;font-size:${inkFit(b.x, 720, 46)}px` }, N(b.x));
  if (b.t === 'gap') return h('div', { class: 'ib', style: st });
  if (b.t === 'pg') return kPgEl(b);
  if (b.t === 'lines') return h('div', { class: 'ib ib-lines', style: st }, ...Array.from({ length: b.n || 1 }, () => inkLineRow()));
  if (b.t === 'dict') return h('div', { class: 'ib ib-lines', style: st }, ...b.w.map((w, i) => {
    const btn = h('span', { class: 'il-say', 'data-tap': '1' }, '🔊'); btn._tap = () => { Log.ev({ k: 'tts', txt: stripT(N(w)).slice(0, 40) }); Say.speakUI(btn, w); };
    return inkLineRow(h('span', {}, btn, h('b', { class: 'il-num' }, toAr(i + 1)), opt.key ? h('span', { class: 'il-key', style: `font-size:${inkFit(w, 520, 24)}px` }, '✔ ', N(w)) : null), 'il-dict');
  }));
  if (b.t === 'match') return h('div', { class: 'ib ib-match', style: st }, ...b.r.map((r, i) => h('div', { class: 'im-row' },
    h('span', { class: 'im-box r', style: `font-size:${inkFit(r, 220, 32)}px` }, N(r)), h('i', { class: 'im-dot' }), h('span', { class: 'im-gap' }), h('i', { class: 'im-dot' }),
    h('span', { class: 'im-box l', style: `font-size:${inkFit(b.l[i] || '', 350, 28)}px` }, N(b.l[i] || '')))));
  if (b.t === 'circle') return h('div', { class: 'ib ib-circle', style: st }, ...b.w.map(w => h('span', { class: 'ic-w', style: `font-size:${inkFit(w, 150, 34)}px` }, N(w))));
  if (b.t === 'tick') return h('div', { class: 'ib ib-tick', style: st }, h('div', { class: 'it-q', style: `font-size:${inkFit(b.q, 740, 30)}px` }, N(b.q)), ...b.o.map(o => h('div', { class: 'it-o' }, h('i', { class: 'it-box' }), h('span', { style: `font-size:${inkFit(o, 640, 30)}px` }, N(o)))));
  return h('div', {});
}

const Ink = {
  penSeen: (() => { try{ return localStorage.getItem(LSP+'pen') === '1'; }catch(e){ return false; } })(),
  count(strokes){ let n = 0; for (const s of strokes || []){ if (s.clr) n = 0; else if (!s.e) n++; } return n; },
  /* يرسم كل الخطوط (بعد آخر «مسح الكل») على سياق مضبوط على الإحداثيات المنطقية */
  paint(ctx, strokes, H){
    ctx.clearRect(0, 0, INK_W, H); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    let from = 0; for (let i = 0; i < strokes.length; i++) if (strokes[i].clr) from = i + 1;
    for (let i = from; i < strokes.length; i++) this.stroke(ctx, strokes[i]);
    ctx.globalCompositeOperation = 'source-over';
  },

/* تعرض الورقة، وتحفظ تلقائيًا، وعند «خلصت» تعيد {id,n,pen}. الخروج قبل الإكمال لا يُضيّع ما كُتب. */
function inkStep(g, { id, spec, path, label, page, intro, min = 2, done = '✅ خَلَصْتُ — أَرْسِلِي لِبَابَا' }){
  return new Promise(res => {
    const pad = Ink.open({ id, spec, path, label, page });
    const finish = async r => { g.abortCurrent = null; try{ await pad.flush(); }catch(e){} pad.destroy(); res(r); };
    g.abortCurrent = r => finish(r);
    Log.ev({ k: 'ink_open', s: path, id });
    g.body.replaceChildren(...kids(intro ? h('div', { class: 'card sand small' }, intro) : null, pad.el));
    g.foot.replaceChildren(h('button', { class: 'btn btn-green', id: 'ink-done', onclick: () => {
      if (pad.count() < min) return toast('اكْتُبِي فِي الْوَرَقَةِ أَوَّلًا ✏️');
      Log.ev({ k: 'ink', s: path, id, n: pad.count(), pen: pad.isPen() }); finish({ id, n: pad.count(), pen: pad.isPen() });

}
/* يرسل ورقة مكتوبة إلى بابا للتقييم (يحدّث الطلب السابق لنفس المحطة إن كان لم يُقيَّم بعد) */
async function inkSubmit({ id, station, lesson, title, key, skill, pen, n }){
  Child.ensure(); const old = S.child.pending.find(p => p.type === 'ink' && p.ink === id && p.status === 'pending');
  if (old){ old.ts = Date.now(); old.pen = !!pen; old.n = n; return Child.save(); }
  return Child.addPending({ type: 'ink', station, lesson: lesson || '', title: title || '', ink: id, key: key || '', skill: skill || '', pen: !!pen, n: n || 0, page: pageOf(station) || null });
}

/* أجزاء الوحدة بترتيب صفحات الكتاب (كل جزء له مسار وحد أقصى من النجوم).

  if (!remindOn() || !prev || lampState(path)) return enter();
  Log.ev({k:'prev_warn', s:path, prev:prev.path});
  openSheet(h('div',{class:'stack'},
    h('h3',{},'🌟 لَحْظَة يَا ', childName(), '!'),
    h('p',{}, `مَا خَلَّصْتِ ${what} بَعْدُ: `, h('b',{}, prev.name), '.'),
    h('p',{class:'small'},'الْأَفْضَلُ أَنْ تُكْمِلِيهِ أَوَّلًا. وَإِذَا طَلَبَتْ مِنْكِ الْمُعَلِّمَةُ هَذَا الدَّرْسَ، ادْخُلِي هُنَا 👇'),
    h('div',{class:'row center'},
      h('button',{class:'btn btn-primary', onclick:()=>{ closeSheet(); Log.ev({k:'prev_back', s:path}); prev.go(); }},'أُكْمِلُ السَّابِقَ ↩️'),
      h('button',{class:'btn', onclick:()=>{ closeSheet(); Log.ev({k:'prev_skip', s:path}); enter(); }},'أَدْخُلُ هُنَا 🚀'))));
}
function enterUnit(u){
  const prev = u.n>1 ? CONTENT.units[u.n-2] : null;
  prevGate({path:u.key, what:'الْوِحْدَةَ السَّابِقَةَ', prev: prev && !unitFinished(prev) ? {path:prev.key, name:`${prev.icon} ${prev.title}`, go:()=>go('unit',prev.key)} : null, enter:()=>go('unit',u.key)});
}
function enterLesson(u,l){
  const prev = l.n===2 ? u.lessons[0] : null;
  prevGate({path:l.key, what:'الدَّرْسَ السَّابِقَ', prev: prev && !lessonFinished(prev) ? {path:prev.key, name:`${prev.emoji} ${lessonTitle(prev)}`, go:()=>go('lesson',prev.key)} : null, enter:()=>go('lesson',l.key)});
}
function enterBoss(u){
  const l = u.lessons.find(x=>!lessonFinished(x));
  prevGate({path:`${u.key}/boss`, what:'أَلْعَابَ الدَّرْسَيْنِ', prev: l && !bossUnlocked(u) ? {path:l.key, name:`${l.emoji} ${l.title}`, go:()=>go('lesson',l.key)} : null, enter:()=>runBoss(u)});
}
const introPaths = () => (kIntroDefs()||[]).map(d=>({p:'intro/'+d.key, max:kMax(d)})).concat(CONTENT.intro.games.map(g=>({p:'intro/'+g.key, max:3})));
const introStars = () => introPaths().reduce((a,x)=>a+Progress.stars(x.p),0);
const introMax = () => introPaths().reduce((a,x)=>a+x.max,0);
const libPaths = () => (kLibDefs()||[]).map(d=>({p:'lib/'+d.key, max:kMax(d)})).concat(CONTENT.library.map(s=>({p:'lib/'+s.key, max:3})));
const libStars = () => libPaths().reduce((a,x)=>a+Progress.stars(x.p),0);
const libMax = () => libPaths().reduce((a,x)=>a+x.max,0);
const TOTAL_MAX = () => CONTENT.units.reduce((a,u)=>a+unitMax(u),0) + introMax() + libMax();

/* ===================== الشاشة الرئيسية ===================== */
function render(){
  if (PARENT_ONLY && S.screen!=='setup' && S.screen!=='parent') return renderParentLock();
  if (Lock.blocks()) return renderLocked();
  Lock.shown=false;
  if (S.screen==='home') renderHome();
  else if (S.screen==='unit') renderUnit(S.nav[0], S.nav[1]);
  else if (S.screen==='lesson') renderLesson(S.nav[0], S.nav[1]);
  else if (S.screen==='library') renderLibrary(S.nav[0]);
  else if (S.screen==='intro') renderIntro(S.nav[0]);
  else if (S.screen==='parent') renderParent(S.nav[0]);
  else if (S.screen==='setup') renderSetup();
  else renderHome();
}

/* تشغيل محطة/كتلة من مسارها (يُستخدم في خطة الأسبوع والمهام) */
function runByPath(path){
  if (Lock.blocks()) return render();
  if (kDefOf(path)) return kRun(path);
  const [a,b]=path.split('/');
  const f=findLesson(a);
  if (f && b){ if (lessonStations(f.lesson).some(d=>d.key===b)) return runStation(f.unit, f.lesson, b); return go('lesson', a); }
  const u=CONTENT.units.find(x=>x.key===a);
  if (u){ if(b && b.startsWith('k-') && kUnitDef(a,b)) return kRunUnit(u,b); if(b==='warmup') return runWarmup(u); if(b==='listen') return runListening(u); if(b==='nasheed') return runNasheed(u); if(b==='boss') return runBoss(u); if(b==='verse'||b==='guide') return runUnitInfo(u,b); if(b==='task') { const c=path.split('/')[2]; go('unit',u.key); return openTasks(u, c||null); } return go('unit', u.key); }
  if (a==='intro'){ const gm=CONTENT.intro.games.find(g=>g.key===b); return gm? runIntroGame(gm) : go('intro'); }
  if (a==='lib'){ const s=CONTENT.library.find(x=>x.key===b); return s? runLibrary(s) : go('library'); }
  if (a==='review') return runReview();
  go('home');
}
const PLAN_DAYS=[['sun','الأحد'],['mon','الاثنين'],['tue','الثلاثاء'],['wed','الأربعاء'],['thu','الخميس']];
function todayPlanKey(){ return ['sun','mon','tue','wed','thu','fri','sat'][new Date().getDay()]; }
/* أُنجزت اليوم: لعبتها وأخذت نجومها اليوم، أو أرسلتها لبابا اليوم (اللمبة لا تنتظر تقييم بابا حتى تتحول إلى ✅) */
function sentToday(path){ const L=(S.child && S.child.pending)||[]; const t=dayKey(); return L.some(p=>p.station===path && p.status!=='removed' && p.ts && dayKey(p.ts)===t); }
function targetDoneToday(path){ const b=Progress.ensure().best[path]; return !!(b && b.last && dayKey(b.last)===dayKey()) || sentToday(path); }
/* هدف الخطة قد يكون محطة، أو درسًا كاملًا (أي محطة منه)، أو «مهمة الوحدة» (أي مهمة منها) */
function planDoneToday(p){
  if (!p) return false; if (targetDoneToday(p)) return true;
  if (!p.includes('/')){ const f=findLesson(p); return !!f && lessonStations(f.lesson).some(d=>targetDoneToday(`${p}/${d.key}`)); }
  if (/^u\d\/task$/.test(p)){ const u=CONTENT.units.find(x=>x.key===p.split('/')[0]); return !!u && unitTasks(u).some(t=>targetDoneToday(`${u.key}/task/${t.key}`)); }
  return false;
}
/* اسم بسيط ومشكول للمحطة يناسب طفلة في الصف الثاني (يظهر للبنت بدل مصطلحات المدرسة) */
function kidLabel(path){
  const [a,b]=path.split('/');
  const f=findLesson(a);
  { const kd=kDefOf(path); if(kd){ const ku=CONTENT.units.find(x=>x.key===a); return `${kd.icon} ${kd.title}${f? ' — '+lessonTitle(f.lesson) : ku? ' — '+ku.title : ''}`; } }
  if (f){ const d=lessonStations(f.lesson).find(x=>x.key===b); return d? `${d.icon} ${d.title} — ${f.lesson.title}` : `${f.lesson.emoji} دَرْسُ ${lessonTitle(f.lesson)}`; }
  const u=CONTENT.units.find(x=>x.key===a);
  if (u){ const kd=kUnitDef(a,b); if(kd) return `${kd.icon} ${kd.title} — ${u.title}`; const c=path.split('/')[2]; if(b==='task' && c){ const t=unitTasks(u).find(x=>x.key===c); if(t) return `${t.emoji} ${t.title} — ${u.title}`; }
    const m={warmup:`🎈 نَشَاطَاتُ التَّهْيِئَةِ — ${u.title}`, listen:`👂 نَصُّ الِاسْتِمَاعِ: ${u.listening.title}`, nasheed:`🎵 نَشِيدُ: ${u.nasheed.title}`, boss:`🦅 تَحَدِّي الْوِحْدَةِ — ${u.title}`, task:`🏡 مَهَمَّةٌ مَعَ بَابَا — ${u.title}`, verse:`📖 آيَةٌ كَرِيمَةٌ — ${u.title}`, guide:`🗺️ مَاذَا سَنَتَعَلَّمُ؟ — ${u.title}`}; return m[b] || `${u.icon} ${u.title}`; }
  if (a==='intro'){ const g=CONTENT.intro.games.find(x=>x.key===b); return g? `🔤 ${g.title}` : '🔤 مُرَاجَعَةُ مُكْتَسَبَاتِي'; }
  if (a==='lib'){ const s=CONTENT.library.find(x=>x.key===b); return s? `${s.icon} قِصَّةُ: ${s.title}` : '📚 مَكْتَبَةُ الصَّقْرِ'; }
  if (a==='review') return '🧰 صُنْدُوقُ الْأَخْطَاءِ';
  return path;
}

function renderUnit(key, tab){
  const u=CONTENT.units.find(x=>x.key===key); if(!u) return go('home');
  Child.ensure(); const KU=kUnit(u.key); const xtab=!!KU && tab==='x';
  const pendingOf = path => S.child.pending.some(p=>p.task && p.status==='pending' && (p.station===path || (path.endsWith('/extra') && u.tasks.some(t=>p.station===`${u.key}/task/${t.key}`))));
  const runners={warmup:()=>runWarmup(u), listen:()=>runListening(u), nasheed:()=>runNasheed(u), boss:()=>runBoss(u), verse:()=>runUnitInfo(u,'verse'), guide:()=>runUnitInfo(u,'guide')};
  /* الوحدة المحوَّلة إلى «كتابي»: تبويب من الكتاب نفسه (الأساس) + تبويب «تمرين» لألعاب اللعبة كما هي */
  const shown=unitBlocks(u).filter(b=> !KU || (xtab? !!b.x : !b.x));
  const nodes=shown.map((b,i)=>{
    const st=blockStars(u,b);

/* ===================== تشغيل محطة ===================== */
async function runStation(u, l, key){
  if (Lock.blocks()) return render();
  if (String(key).startsWith('k-')) return kRunStation(u, l, key);
  const xt = kLesson(l.key) ? 'x' : undefined;   /* في الدروس المحوَّلة: ألعاب اللعبة تحت تبويب «تمرين» */
  const def=STATION_DEFS.find(d=>d.key===key); const path=`${l.key}/${key}`; const skill=stationSkill(def,l);
  Log.ev({k:'station_start', s:path});
  const g=makeGame(`${def.icon} ${def.title} — ${N(l.title)}`); g.setSrc(path);
  let r;
  try{
    if (key==='read') r=await stRead(g,u,l,path);
    else if (key==='quiz') r=await stQuiz(g,u,l,path);
    else if (key==='vocab') r=await stVocab(g,u,l,path);
    else if (key==='phon') r=await stPhon(g,u,l,path);
    else if (key==='sort') r=await stSort(g,l.sort,path,{title:l.sort.title});
    else if (key==='dict') r=await stDict(g,u,l,path);
    else if (key==='style') r=await stList(g,l.style,path,'🪄');
    else if (key==='transform') r=await stList(g,l.transform,path,'⚙️');
    else if (key==='khat') r=await stKhat(g,l.khat,path,l.key,N(l.title));
    else if (key==='color') r=await stColor(g,u,l,path);
    else if (key==='hw') r=await stHomework(g,u,l,path);
    else if (key==='sheet') r=await stSheet(g,u,l,path);
    else if (key==='express') r=await stExpress(g,u,l,path, {title:'رَتِّبِي الْجُمْلَةَ', tip:'رَتِّبِي الْكَلِمَاتِ لِتَصِيرَ جُمْلَةً صَحِيحَةً. لَا تَنْسَيِ النُّقْطَةَ فِي النِّهَايَةِ.', items:expressItems(l), skill:'express'},path,'🏗️');
  }catch(e){ console.error(e); toast('حَدَثَ خَطَأٌ، ارْجِعِي وَجَرِّبِي مَرَّةً ثَانِيَةً'); }
  if (!r || r.aborted){ if(!(r&&r.quiet)) Log.ev({k:'station_abort', s:path}); return go('lesson', l.key, xt); }
  const idx=STATION_DEFS.findIndex(d=>d.key===key); const nxt=STATION_DEFS[idx+1];
  const act = await finishStation(g, Object.assign({path, skill, next: (nxt && !Lock.on())? `التَّالِي: ${nxt.title} ${nxt.icon}` : null}, r));
  if (act==='next' && nxt && !Lock.on()) return runStation(u,l,nxt.key);
  go('lesson', l.key, xt);
}

/* ---------- 1) اسمعي واقرئي ---------- */
async function stRead(g,u,l,path){
  const ok=await introCard(g,{emoji:'📖', title:`قِصَّةُ: ${l.title}`, tip:'اسْمَعِي الْقِصَّةَ أَوَّلًا، ثُمَّ اقْرَئِيهَا بِصَوْتٍ عَالٍ. 👨 بَابَا يَسْمَعُكِ وَيُعْطِيكِ النُّجُومَ.'});
  if(ok.aborted) return ok;
  // الجزء الأول: الاستماع
  const sents=l.story; const box=storyEl(sents);
  const state={stop:false};
  let listened=false;
  const part1=await new Promise(res=>{
    g.abortCurrent=r=>{ state.stop=true; res(r); };
    const play=h('button',{class:'btn btn-primary', onclick:async()=>{ play.disabled=true; Log.ev({k:'listen_start', s:path}); const t=Date.now(); await speakStory(box,sents,state); listened=true; Log.ev({k:'listen_end', s:path, ms:Date.now()-t}); play.disabled=false; play.textContent='🔁 اسْمَعِي مَرَّةً ثَانِيَةً'; nextB.classList.add('btn-primary'); }},'▶️ اسْمَعِي الْقِصَّةَ');
    const nextB=h('button',{class:'btn', onclick:()=>{ state.stop=true; Say.stop(); res(true); }},'التَّالِي: اقْرَئِي بِنَفْسِكِ ←');
    g.body.replaceChildren(h('div',{class:'card sand small'},'👂 أَوَّلًا: اسْمَعِي الْقِصَّةَ. الْجُمْلَةُ الَّتِي تُقْرَأُ تَتَلَوَّنُ.'), box);
    g.foot.replaceChildren(play, nextB);
  });
  if (part1.aborted) return part1;
  // الجزء الثاني: القراءة الجهرية مع تسجيل الصوت (تقدر تعيد القراءة والتسجيل)
  const hard=[]; const words=sents.map(s=>N(s).split(/\s+/).filter(Boolean).length).reduce((a,b)=>a+b,0);
  const rd=await readAloudFlow(g, {sents, path, hard, intro:'🗣️ ثَانِيًا: اقْرَئِي بِصَوْتٍ عَالٍ. الْجَوَّالُ يُسَجِّلُ صَوْتَكِ لِيَسْمَعَهُ بَابَا. إِذَا صَعُبَتْ كَلِمَةٌ اضْغَطِيهَا لِتَسْمَعِيهَا.'});
  if (rd.aborted) return rd;
  const {ms, rec}=rd; const wpm = ms>0 ? Math.round(words/(ms/60000)) : 0;
  Log.ev({k:'read_end', s:path, ms, words, wpm, hard:hard.slice(0,20), rec:!!rec});
  Progress.ensure(); S.progress.reading.push({ts:Date.now(), lesson:l.key, ms, wpm, hard:hard.length}); S.progress.reading=S.progress.reading.slice(-60);
  const approval=await approvalStep(g, {title:'قَرَأْتِ الْقِصَّةَ كَامِلَةً!', ms, rec});
  if (approval.aborted) return approval;
  const audio = rec ? await Rec.save(rec,{path, kind:'read', text:N(l.title)}) : null;
  if (approval.pending){
    await Child.addPending({type:'read', station:path, lesson:l.key, title:N(l.title), ms, wpm, words, hard:hard.slice(0,20), audio: audio? audio.id : null, audioType: audio? audio.type : null});
    return {acc:0, ms, pending:true, extra:{wpm, rec:!!audio}};
  }
  const stars=approval.rating; Log.ev({k:'read_rated', s:path, rating:stars, notes:approval.notes});
  S.progress.reading[S.progress.reading.length-1].rating=stars;
  return {acc: stars/3, ms, stars, extra:{wpm, notes:approval.notes, rec:!!audio}, total:1};
}
/* قراءة جهرية مع تسجيل تلقائي: ▶️ بدأت ← ⏹️ خلصت ← اسمعي/أعيدي ← التالي. تعيد {ms, rec|null} أو {aborted} */
async function readAloudFlow(g, {sents, path, hard, intro, tappable=true, boxEl=null, under=null}){
  for(;;){
    const box = boxEl || storyEl(sents,{tappable, onWord:(w)=>{ hard.push(stripT(w)); Log.ev({k:'word_tap', s:path, w:stripT(w)}); }});
    const timerEl=h('div',{class:'timer'},'00:00'); let t0=0, iv=null, ms=0, session=null; const recInd=h('div',{class:'rec-status'},'');
    const part=await new Promise(res=>{
      g.abortCurrent=r=>{ clearInterval(iv); if(session) session.cancel(); res(r); };
      const startB=h('button',{class:'btn btn-primary', onclick:async()=>{ startB.disabled=true; session=await startBackgroundRec(); t0=Date.now(); Log.ev({k:'read_start', s:path, rec:!!session}); iv=setInterval(()=>{ timerEl.textContent=fmtMs(Date.now()-t0); },500); startB.hidden=true; stopB.hidden=false; recInd.replaceChildren(session? h('span',{class:'rec-dot'}):'', session? ' يُسَجِّلُ صَوْتَكِ 🎙️' : ' (بِدُونِ تَسْجِيلٍ)'); }},'▶️ بَدَأْتُ الْقِرَاءَةَ');
      const stopB=h('button',{class:'btn btn-green', hidden:true, onclick:async()=>{ clearInterval(iv); ms=Date.now()-t0; const sess=session; session=null; const rec= sess? await sess.stop() : null; res({ms, rec: rec && rec.blob.size? rec : null}); }},'✅ خَلَصْتُ');
      g.body.replaceChildren(h('div',{class:'card sand small'}, intro), recInd, timerEl, box, under? under(box):null);
      g.foot.replaceChildren(startB, stopB);
    });
    if (part.aborted) return part;
    if (!part.rec) return {ms:part.ms, rec:null};
    const rv=await reviewRecording(g, part.rec, {ms:part.ms});
    if (rv.aborted) return rv;
    if (rv.ok) return {ms:part.ms, rec:part.rec};
    Log.ev({k:'read_redo', s:path});
  }
}
/* خطوة الاعتماد: بابا موجود (رمز + تقييم) أو إرسال له. تعيد {rating,notes} | {pending:true} | {aborted} */

      h('p',{}, 'هَلْ بَابَا مَوْجُودٌ لِيَسْمَعَكِ الْآنَ؟')));

      skippable? h('button',{class:'btn btn-ghost btn-sm', onclick:()=>res({skip:true})},'تَخَطِّي'):null);
  });
}
function rateSheet(res){
  const notes=new Set(); const chips=['الحركات','الكلمات الطويلة','السرعة','الوقوف عند النقطة','الهمزات','التنوين'];

/* ---------- 3) كنز الكلمات ---------- */
async function stVocab(g,u,l,path){
  const ok=await introCard(g,{emoji:'💎', title:'كَنْزُ الْكَلِمَاتِ', tip:'اقْلِبِي الْبِطَاقَاتِ، وَاجْمَعِي كُلَّ كَلِمَةٍ مَعَ مَعْنَاهَا. ثُمَّ أَجِيبِي عَنْ أَسْئِلَةٍ صَغِيرَةٍ.'});
  if(ok.aborted) return ok;
  const level=Progress.skillLevel('vocab'); const pairs=pick(l.vocab, level===1?3:4);
  const t0=Date.now(); let moves=0, matched=0, flipped=[];
  const mem=await new Promise(res=>{
    g.abortCurrent=r=>res(r);
    const cards=shuffle(pairs.flatMap((p,i)=>[{id:i,txt:p.w,kind:'w'},{id:i,txt:p.m,kind:'m'}]));
    const els=cards.map((c,ci)=>{ const el=h('button',{class:'mcard', onclick:()=>flip(ci)}, h('div',{class:'in'}, h('div',{class:'f'},'💎'), h('div',{class:'b', style:c.kind==='w'?'font-size:1.35rem;font-weight:700':''}, c.txt))); return el; });
    function flip(ci){
      const el=els[ci]; if(el.classList.contains('flip')||flipped.length===2) return;
      el.classList.add('flip'); flipped.push(ci); if(cards[ci].kind==='w') Say.speak(cards[ci].txt);
      if(flipped.length===2){ moves++; const [a,b]=flipped; const okm=cards[a].id===cards[b].id && cards[a].kind!==cards[b].kind;
        Log.ev({k:'mem_pair', s:path, ok:okm, a:stripT(cards[a].txt).slice(0,20), b:stripT(cards[b].txt).slice(0,20)});
        setTimeout(()=>{ if(okm){ els[a].classList.add('matched'); els[b].classList.add('matched'); matched++; if(matched===pairs.length){ fb.className='feedback ok'; fb.textContent='جَمَعْتِ كُلَّ الْبِطَاقَاتِ! 🎉'; setTimeout(()=>res(true),900);} } else { els[a].classList.remove('flip'); els[b].classList.remove('flip'); } flipped=[]; }, okm?300:900); }
    }
    const fb=h('div',{class:'feedback info'},'اقْلِبِي بِطَاقَتَيْنِ: كَلِمَةً وَمَعْنَاهَا 💎');
    g.body.replaceChildren(h('div',{class:'mem'},...els), fb); g.foot.replaceChildren();
  });
  if(mem.aborted) return mem;
  const memAcc = clamp(pairs.length*1.6/moves, 0, 1);
  // خريطة المفردة
  const items=[]; const types=['اسم','فعل','حرف'];
  for (const v of pick(l.vocab, 2)){
    const otherM=pick(l.vocab.filter(x=>x!==v).map(x=>x.m),2);
    items.push({t:'mcq', q:`مَا مَعْنَى كَلِمَةِ (${v.w})؟`, opts:[v.m,...otherM], a:0, say:v.w, skill:'vocab'});
    if (v.ant){ const others=pick(l.vocab.filter(x=>x!==v && x.ant).map(x=>x.ant).concat(['كَبِير','صَغِير']).filter(x=>x!==v.ant),2); items.push({t:'mcq', q:`مَا ضِدُّ كَلِمَةِ (${v.w})؟`, opts:[v.ant,...others], a:0, skill:'vocab'}); }
    items.push({t:'mcq', q:`مَا نَوْعُ كَلِمَةِ (${v.w})؟`, opts:[v.type, ...types.filter(x=>x!==v.type)], a:0, skill:'wordtype'});
  }
  const r=await runItems(items,{g,path,skill:'vocab',autoSay:false});
  if(r.aborted) return r;
  const acc=(memAcc + r.acc*2)/3;
  return {acc, ms:Date.now()-t0, total:r.total+pairs.length, skillTally:r.skillTally, extra:{moves}};
}

/* ---------- 5) سلة الفرز ---------- */
async function stSort(g, sort, path, opts={}){
  const ok=await introCard(g,{emoji:'🧺', title:sort.title||opts.title||'أَيُّ سَلَّةٍ؟', tip:'تَظْهَرُ لَكِ كَلِمَةٌ، اضْغَطِي السَّلَّةَ الصَّحِيحَةَ لَهَا. 🧺'});
  if(ok.aborted) return ok;
  const items=shuffle(sort.items); const t0=Date.now(); const results=[]; const counts={};
  const timerEl=h('div',{class:'timer'},'00:00'); const iv=setInterval(()=>{ timerEl.textContent=fmtMs(Date.now()-t0); },500);
  for (let i=0;i<items.length;i++){
    if(g.aborted){ clearInterval(iv); return {aborted:true}; }
    g.setDots(items.length,i,results);
    const it=items[i];
    const r=await new Promise(res=>{
      g.abortCurrent=r=>res(r); let tries=0, done=false; const ti=Date.now();
      const word=h('div',{class:'bigword'}, it.w);
      const bEls=sort.baskets.map(b=>h('button',{class:'basket', onclick:()=>{
        if(done) return;
        if(b.id===it.b){ done=true; bEls.forEach(x=>x.classList.remove('bad')); e(b.id).classList.add('ok'); counts[b.id]=(counts[b.id]||0)+1; fb.className='feedback ok'; fb.textContent=tries===0?'صَحِيح! 🌟':'تمام 👏'; setTimeout(()=>res({ok:tries===0,tries,ms:Date.now()-ti,ans:b.id}),600); return; }
        tries++; e(b.id).classList.add('bad'); fb.className='feedback bad';
        if(tries>=2){ done=true; e(it.b).classList.add('ok'); fb.textContent='الصَّحِيح: '+sort.baskets.find(x=>x.id===it.b).label; setTimeout(()=>res({ok:false,tries,ms:Date.now()-ti,ans:b.id}),1400); }
        else fb.textContent='لَا، جَرِّبِي سَلَّةً ثَانِيَةً 💪';
      }}, h('span',{},b.label), h('span',{class:'cnt'}, `${counts[b.id]||0}`)));
      const e=id=>bEls[sort.baskets.findIndex(b=>b.id===id)];
      const fb=h('div',{class:'feedback info'},'فِي أَيِّ سَلَّةٍ نَضَعُهَا؟');
      g.body.replaceChildren(timerEl, word, h('div',{class:'row center'}, (()=>{ const b=h('button',{class:'btn btn-sm', onclick:()=>Say.speakUI(b, it.w)},'🔊 اسْمَعِي'); return b; })()), h('div',{class:'baskets'},...bEls), fb); g.foot.replaceChildren();
      setTimeout(()=>Say.speak(it.w),120);
    });
    if(r.aborted){ clearInterval(iv); return r; }
    results.push(r);
    r.mode = r.ok ? 'ind' : r.tries>=2 ? 'shown' : 'help';
    Log.ev({k:'answer', s:path, skill:sort.skill, it:stripT(it.w), ans:r.ans, ok:r.ok, mode:r.mode, tries:r.tries, ms:r.ms});
    if(!r.ok) Mistakes.add({t:'sortone', w:it.w, baskets:sort.baskets, b:it.b, skill:sort.skill}, sort.skill, path);
  }
  clearInterval(iv); const okN=results.filter(r=>r.ok).length;
  return {acc: okN/results.length, ms:Date.now()-t0, total:results.length, skillTally:{[sort.skill]:{ok:okN,total:results.length, help:results.filter(r=>r.mode==='help').length, shown:results.filter(r=>r.mode==='shown').length}}};
}

/* ---------- ورقة عملي: توصيل ودوائر وعلامة صح وكتابة جواب — كلها بالقلم في موضع الإجابة ---------- */
function sheetSpec(l){
  const vp=l.vocab.slice(0,4); const circ=l.sort; const b0=circ.baskets[0]; const cw=shuffle(circ.items.slice()).slice(0,8);
  const qs=l.quiz.slice(0,2).map(q=>{ const o=shuffle(q.opts.map((x,i)=>({x,ok:i===q.a}))); return {q:q.q, o:o.map(z=>z.x), a:o.findIndex(z=>z.ok)}; });
  const wq=l.quiz[2]||l.quiz[0];
  const left=shuffle(vp.map(v=>v.m));
  const spec=[{t:'title',x:'وَرَقَةُ عَمَلِي — '+l.title},
    {t:'note',x:'١) صِلِي كُلَّ كَلِمَةٍ بِمَعْنَاهَا بِخَطٍّ.'},{t:'match',r:vp.map(v=>v.w),l:left},
    {t:'note',x:'٢) ضَعِي دَائِرَةً حَوْلَ كَلِمَاتِ: '+b0.label},{t:'circle',w:cw.map(x=>x.w)},
    {t:'note',x:'٣) ضَعِي عَلَامَةَ ✓ فِي مُرَبَّعِ الْجَوَابِ الصَّحِيحِ.'}, ...qs.map(q=>({t:'tick',q:q.q,o:q.o})),
    {t:'note',x:'٤) اكْتُبِي الْجَوَابَ فِي جُمْلَةٍ كَامِلَةٍ: '+wq.q},{t:'lines',n:2}];
  const key=['١) '+vp.map(v=>`${N(v.w)} ← ${N(v.m)}`).join(' ؛ '), '٢) '+cw.filter(x=>x.b===b0.id).map(x=>N(x.w)).join('، '), '٣) '+qs.map(q=>N(q.o[q.a])).join(' ؛ '), '٤) '+N(wq.opts[wq.a])].join('\n');

}

const PEN_COLORS=['#F28C28','#E53935','#1E88E5','#43A047','#8E24AA','#F4B400','#00ACC1','#6D4C41'];
async function traceCanvas(g, text, {lessonKey, path, kind='khat', fontMax=120, hint}={}){
  try{ await document.fonts.load('48px "Noto Naskh Arabic"'); }catch(e){}
  const t0=Date.now();
  const W=Math.min(760, Math.max(320, (g.body.clientWidth||360)))*2, H=300*2;
  const cv=h('canvas',{width:W,height:H, style:'width:100%'}); const ctx=cv.getContext('2d');

  const ink=document.createElement('canvas'); ink.width=W; ink.height=H; const ictx=ink.getContext('2d');
  const txt=N(text); const base=H*0.62;
  function fitFont(c){ let fs=fontMax; c.font=`${fs}px "Noto Naskh Arabic", serif`; const w=c.measureText(txt).width; fs=Math.min(fontMax, Math.floor(fs*(W-80)/w)); return fs; }
  const fs=fitFont(ctx); let pen=PEN_COLORS[0];
  function drawGuides(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#cfd8e3'; ctx.lineWidth=3; [base-fs*0.72, base-fs*0.36, base, base+fs*0.36].forEach((y,i)=>{ ctx.beginPath(); ctx.setLineDash(i===2?[]:[12,10]); ctx.moveTo(20,y); ctx.lineTo(W-20,y); ctx.stroke(); });
    ctx.setLineDash([]); ctx.font=`${fs}px "Noto Naskh Arabic", serif`; ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.direction='rtl';
    ctx.fillStyle='#b8c2cf'; ctx.fillText(txt, W/2, base);
  }
  drawGuides();
  mctx.font=`${fs}px "Noto Naskh Arabic", serif`; mctx.textAlign='center'; mctx.textBaseline='alphabetic'; mctx.direction='rtl'; mctx.fillStyle='#000'; mctx.strokeStyle='#000'; mctx.lineWidth=fs*0.22; mctx.lineJoin='round'; mctx.strokeText(txt,W/2,base); mctx.fillText(txt,W/2,base);
  const maskData=mctx.getImageData(0,0,W,H).data;

function buildBossItems(u){
  const items=[]; const [a,b]=u.lessons; const both=[a,b];
  for (const l of both){ const v=pick(l.vocab,1)[0]; const others=pick(l.vocab.filter(x=>x!==v).map(x=>x.m),2); items.push({t:'mcq', q:`مَا مَعْنَى كَلِمَةِ (${v.w})؟`, opts:[v.m,...others], a:0, skill:'vocab'}); }
  for (const l of both){ const it=pick(l.phon.items,1)[0]; items.push({t:'mcq', q:`${l.phon.q}\n(${it.w})`, say:it.w, opts:it.opts, a:it.a, skill:l.phon.skill}); }
  for (const l of both){ items.push({t:'dict', w:pick(l.dict.words,1)[0], mode:'flash', skill:'dict'}); }
  for (const l of both){ items.push(Object.assign({}, pick(l.style.items.filter(x=>x.t==='mcq'),1)[0], {skill:l.style.skill})); }
  items.push(Object.assign({}, pick(a.transform.items.filter(x=>x.t==='mcq'),1)[0], {skill:a.transform.skill}));
  items.push(Object.assign({}, pick(b.express,1)[0], {skill:'express'}));
  return shuffle(items);
}

function reciteBtn(ayat, path, box){
  let playing=false;
  const b=h('button',{class:'btn btn-sm btn-sky', onclick:async()=>{
    if (playing){ Say.stop(); playing=false; b.textContent='🔊 اسْمَعِي التِّلَاوَةَ'; return; }
    playing=true; b.textContent='⏹️ إِيقَاف'; Log.ev({k:'recite', s:path});
    const sents = box ? box.querySelectorAll('.sent') : [];
    for (let i=0;i<ayat.length && playing;i++){ sents.forEach(x=>x.classList.remove('cur')); if(sents[i]) sents[i].classList.add('cur'); const ok=await Say.play(ayahUrl(ayat[i][0], ayat[i][1])); if(!ok){ toast('مَا قَدَرْتُ أُشَغِّلُ التِّلَاوَةَ، تَأَكَّدِي مِنَ الْإِنْتَرْنِت'); break; } }
    sents.forEach(x=>x.classList.remove('cur')); playing=false; b.textContent='🔊 اسْمَعِي التِّلَاوَةَ';
  }},'🔊 اسْمَعِي التِّلَاوَةَ');
  return b;
}

async function introRead(g, gm, path){
  const B=gm.block; const ok=await introCard(g,{emoji:'📖', title:gm.title, text:B.ref, tip:gm.intro}); if(ok.aborted) return ok;
  const mkBox=()=>h('div',{class:'story quran'}, h('p',{class:'small', style:'text-align:center;font-family:var(--f-display)'}, B.ref), ...B.lines.map((ln,i)=>h('span',{class:'sent'}, ln, ' ', h('b',{class:'aya'}, toAr(i+1)), ' ')));
  const words=B.lines.join(' ').split(/\s+/).filter(Boolean).length; const hard=[];
  const rd=await readAloudFlow(g, {sents:B.lines, path, hard, tappable:false, boxEl:mkBox(), intro:'🗣️ اسْمَعِي التِّلَاوَةَ أَوَّلًا 🔊، ثُمَّ اقْرَئِي الْآيَاتِ بِصَوْتٍ وَاضِحٍ وَهَادِئٍ وَقِفِي عِنْدَ نِهَايَةِ كُلِّ آيَةٍ. الْجَوَّالُ يُسَجِّلُ صَوْتَكِ لِبَابَا.', under: B.ayat? (box)=>h('div',{class:'stack', style:'align-items:center;gap:4px'}, h('div',{class:'row center'}, reciteBtn(B.ayat, path, box)), h('p',{class:'tiny'}, '🎧 بِصَوْتِ ', QURAN_RECITER)) : null});
  if (rd.aborted) return rd;
  const {ms, rec}=rd; Log.ev({k:'read_end', s:path, ms, words, wpm: ms>0? Math.round(words/(ms/60000)):0, rec:!!rec});
  const approval=await approvalStep(g, {title:'قَرَأْتِ الْآيَاتِ كَامِلَةً!', ms, rec});
  if (approval.aborted) return approval;
  const audio = rec ? await Rec.save(rec,{path, kind:'read', text:B.ref}) : null;
  if (approval.pending){ await Child.addPending({type:'read', station:path, lesson:'intro', title:N(gm.title)+' — '+B.ref, ms, wpm:0, words, hard:[], audio: audio? audio.id:null, audioType: audio? audio.type:null}); return {acc:0, ms, pending:true}; }

  return {acc: approval.rating/3, ms, stars:approval.rating, total:1, extra:{notes:approval.notes, rec:!!audio}};
}

/* ===================== كتابي: محتوى كتاب المدرسة نفسه داخل اللعبة =====================
   القاعدة: ما يظهر للطفلة هو الكتاب نفسه — صور صفحاته الرسمية من منصة «عين» (وزارة التعليم) —
   وكل نشاط يُنفَّذ كما يطلبه الكتاب:
     أقرأ / أنشد        ← تقرأ ويُسجَّل صوتها لبابا
     أستمع              ← تسمع الصوت الرسمي المرفق برمز الكتاب
     أجيب شفهيًا / أستخدم ← تجيب بصوتها ويُسجَّل
     أكتب / أرسم / أصل / أضع علامة / أكمل ← بالقلم في نفس موضعها من صفحة الكتاب
   الكلمات المفردة من الكتاب (معاني، أضداد، مقاطع) تُلعب بألعاب اللعبة نفسها مع الصوت.
   ما ليس من الكتاب (قصص وألعاب اللعبة) يبقى كما هو في تبويب «تمرين».
   النصوص والأناشيد والجمل لا تُعاد كتابتها هنا: تُعرض من صورة الصفحة فقط.
   مصدر الصور: نسخة العائلة الخاصة من الكتاب (كل الصفحات، واضحة) برمز لا يوجد في هذا الملف؛
   وإن لم يوجد الرمز على الجهاز فكتيّبات الدروس الرسمية على منصة عين (أقل وضوحًا، ولا تشمل المراجعة
   ومداخل الوحدات والتقويم التجميعي وأنا أقرأ). الصفحتان متطابقتان هندسيًا فالشرائح نفسها تصلح للمصدرين. */
const K_RATIO = 1.2;                       /* ارتفاع صفحة الكتاب ÷ عرضها */
const K_AUDIO = 'https://iencontent.ien.edu.sa/Audio/';
const K_FLIP_BASE = 'https://iencontent.ien.edu.sa/Storage/Flips/';
/* كتيّبات الدروس على منصة عين: [أول صفحة مطبوعة، آخر صفحة، معرّف الكتيّب] — رقم الصورة = الصفحة − الأولى + ١ */
const K_FLIPS = [
  [19,26,'24062025124316363'], [27,35,'18062025083034440'], [36,46,'18062025083123994'],
  [55,59,'18062025083211106'], [60,70,'02062025033627033'], [71,81,'02062025033711997'],
  [89,93,'GE-PE-K02-SM1-lang-U3-L1'], [94,104,'18062025083342460'], [105,113,'18062025083425034'],
  [121,125,'18062025083512373'], [126,136,'02062025034052501'], [137,146,'18062025083601089'],
];
function kPageUrl(p){ const f=K_FLIPS.find(x=>p>=x[0] && p<=x[1]); return f? `${K_FLIP_BASE}${f[2]}/files/mobile/${p-f[0]+1}.jpg` : null; }
const kS = (p,y0,y1,x0=0,x1=1) => ({p,y0,y1,x0,x1});
/* «كتابي» مفعّل افتراضيًا؛ بابا يقدر يوقفه من الإعدادات فترجع اللعبة كما كانت */
function kOn(){ return !(S.settings && S.settings.kitabOff); }

/* ---------- صفحات النسخة الخاصة (لما ليس له كتيّب رسمي): تُجلب مرة وتُحفظ على الجهاز ---------- */
const BookPages = {
  mem:{}, _idb:null,
  code(){ let c=(S.settings && S.settings.bookCode)||''; if(!c){ try{ c=localStorage.getItem(LSP+'book')||''; }catch(e){} } return c; },
  idb(){ if(this._idb) return this._idb; this._idb=new Promise(res=>{ try{ const rq=indexedDB.open('lughati_book',1); rq.onupgradeneeded=()=>rq.result.createObjectStore('p'); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null); rq.onblocked=()=>res(null); }catch(e){ res(null); } }); return this._idb; },
  async cget(k){ const db=await this.idb(); if(!db) return null; return new Promise(res=>{ try{ const rq=db.transaction('p').objectStore('p').get(k); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null); }catch(e){ res(null); } }); },
  async cput(k,v){ const db=await this.idb(); if(!db) return; try{ db.transaction('p','readwrite').objectStore('p').put(v,k); }catch(e){} },
  /* يعيد رابط صورة الصفحة المطبوعة n أو null */
  get(n){
    const code=this.code(); if(!code) return Promise.resolve(null); const k=code+'/'+n;
    if(this.mem[k]) return this.mem[k];
    return this.mem[k]=(async()=>{
      let b64=await this.cget(k);
      if(!b64){ const cfg=window.FIREBASE_CONFIG; if(cfg && cfg.projectId){
        try{ const r=await fetch(`https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/(default)/documents/families/${code}/book/p${String(n).padStart(3,'0')}?key=${cfg.apiKey}`);
          if(r.ok){ const j=await r.json(); b64=(j && j.fields && j.fields.b64 && j.fields.b64.stringValue)||null; if(b64) this.cput(k,b64); } }catch(e){ console.warn('book page', n, e); } } }
      if(!b64){ delete this.mem[k]; return null; }
      try{ const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return URL.createObjectURL(new Blob([u8],{type:'image/jpeg'})); }
      catch(e){ return 'data:image/jpeg;base64,'+b64; }
    })();
  },
  async available(){ return !!(await this.get(17)); }
};
/* رمز صفحات الكتاب يصل مرة واحدة عبر الرابط (?book=...) ثم يُحفظ في إعدادات العائلة فيصل لكل الأجهزة */
function captureBookCode(){

    if(b.length>=10){ localStorage.setItem(LSP+'book', b); u.searchParams.delete('book'); history.replaceState(null,'',u.pathname+u.search+u.hash); } }catch(e){}
}

  : `📖 صَفْحَة ${toAr(p)} مِنْ كِتَابِكِ — مَا قَدَرْتُ أَفْتَحُهَا الْآنَ. تَأَكَّدِي مِنَ الْإِنْتَرْنِت ثُمَّ ارْجِعِي، أَوِ افْتَحِي كِتَابَكِ عَلَى هَذِهِ الصَّفْحَةِ.`; }

/* ---------- صورة صفحة وشريحة منها ---------- */
function kImg(p, style){
  /* المصدر: نسخة العائلة الخاصة أولًا (أوضح: ١٨٠٠×٢١٦٠ من ملف الكتاب نفسه) إن وُجد رمزها، ثم صورة منصة «عين»، ثم رسالة */
  const img=h('img',{class:'k-img', alt:`صفحة ${toAr(p)} من كتاب لغتي`, draggable:'false', referrerpolicy:'no-referrer', decoding:'async', style});
  const off=kPageUrl(p); let stage=0;   /* ١ النسخة الخاصة، ٢ صورة «عين»، ٣ لا شيء */
  const miss=()=>{ stage=3; const box=img.parentElement; if(!box || box.querySelector('.k-miss')) return; img.hidden=true; box.classList.add('ready'); box.append(h('div',{class:'k-miss'}, kMissText(p))); };
  const useOff=()=>{ if(stage>=2 || !off) return miss(); stage=2; img.src=off; };
  const usePriv=()=>{ stage=1; BookPages.get(p).then(u=>{ if(stage!==1) return; if(u) img.src=u; else useOff(); }).catch(()=>{ if(stage===1) useOff(); }); };
  img.addEventListener('load', ()=>{ const box=img.parentElement; if(box) box.classList.add('ready'); });
  img.addEventListener('error', ()=>{ if(stage===1) useOff(); else miss(); });
  if (BookPages.code()) usePriv(); else if (off){ stage=2; img.src=off; } else setTimeout(miss, 0);
  return img;
}
/* شريحة: الجزء {y0..y1, x0..x1} من الصفحة p (كسور من ارتفاع/عرض الصفحة) */
function kStrip(s, opts={}){
  const x0=s.x0||0, x1=(s.x1===undefined?1:s.x1), w=x1-x0, hh=s.y1-s.y0;
  const box=h('div',{class:'k-strip'+(opts.cls?' '+opts.cls:''), style:`aspect-ratio:${w.toFixed(4)} / ${(hh*K_RATIO).toFixed(4)}`});
  box.append(kImg(s.p, `width:${(100/w).toFixed(3)}%;left:${(-x0/w*100).toFixed(3)}%;top:${(-s.y0/hh*100).toFixed(3)}%`));
  return box;
}
/* تحميل مسبق لصفحات المحطة أثناء بطاقة البداية (أول ٦ صفحات مختلفة) */
function kPrefetch(def){ try{ const ps=[]; for(const st of (def.steps||[])){ for(const s of (st.strips||[]).concat((st.spec||[]).filter(b=>b && b.t==='pg'))){ if(s && s.p && !ps.includes(s.p)) ps.push(s.p); } } const priv=!!BookPages.code(); for(const p of ps.slice(0,6)){ const u=kPageUrl(p); if(priv) BookPages.get(p).catch(()=>{}); else if(u){ const im=new Image(); im.referrerPolicy='no-referrer'; im.src=u; } } }catch(e){} }
function kStrips(list, opts){ return h('div',{class:'k-strips'}, ...kUnpack(list).map(s=>kStrip(s, opts))); }
/* تخزين مختصر للشرائح داخل ما يُرسل لبابا: "صفحة,y0,y1,x0,x1;…" بالألف (Firestore لا يقبل مصفوفات متداخلة) */
function kPack(list){ return (list||[]).map(s=>[s.p, Math.round(s.y0*1000), Math.round(s.y1*1000), Math.round((s.x0||0)*1000), Math.round((s.x1===undefined?1:s.x1)*1000)].join(',')).join(';'); }
function kUnpack(v){ if(!v) return []; if(typeof v!=='string') return v; return v.split(';').filter(Boolean).map(t=>{ const a=t.split(',').map(Number); return {p:a[0], y0:a[1]/1000, y1:a[2]/1000, x0:a[3]/1000, x1:a[4]/1000}; }); }
function toArK(n){ return String(n).replace(/\d/g, d=>'٠١٢٣٤٥٦٧٨٩'[d]); }

    KITAB.units[k]={blocks:all, videos:U.videos||null, project:U.project? kStripN(U.project):null, family:U.family? kStripN(U.family):null};
  }
  KITAB.intro=(Gn.intro||[]).map(kNormDef); KITAB.lib=(Gn.lib||[]).map(kNormDef);
})();

/* ---------- استعلامات ---------- */
function kLesson(key){ return (kOn() && KITAB.lessons[key]) || null; }
function kLessonDefs(l){ const L=kLesson(l && l.key); return L? L.stations : null; }
/* عنوان الدرس كما هو في الكتاب (عناوين قصص اللعبة تبقى لألعاب «تمرين») */
function lessonTitle(l){ const L=kLesson(l && l.key); return (L && L.title) || (l && l.title) || ''; }
function kUnit(ukey){ return (kOn() && KITAB.units[ukey]) || null; }
function kUnitDef(ukey, key){ const U=kUnit(ukey); return U? (U.blocks.find(b=>b.key===key)||null) : null; }
function kIntroDefs(){ return (kOn() && KITAB.intro.length)? KITAB.intro : null; }
function kLibDefs(){ return (kOn() && KITAB.lib.length)? KITAB.lib : null; }
/* كل ما يُنطق بصوت اللعبة في محطات «كتابي» (تلميح المحطة، تعليمات الخطوات، كلمات الألعاب) بترتيب الكتاب — لمراجعة بابا لما تسمعه البنت الآن */
function kSpokenTexts(){
  const out=[]; const add=t=>{ if(typeof t==='string' && /[؀-ۿ]/.test(t)) out.push(t); };
  const defs=[...(kIntroDefs()||[])];
  for (const u of CONTENT.units){ const U=kUnit(u.key); if(U) defs.push(...U.blocks); for (const l of u.lessons){ const L=kLesson(l.key); if(L) defs.push(...L.stations); } }
  defs.push(...(kLibDefs()||[]));
  for (const d of defs){ add(d.tip);
    for (const st of d.steps||[]){ add(st.say);
      if (st.t==='mem') for (const pr of st.pairs||[]){ add(pr.w); add(pr.m); }
      if (st.t==='items') for (const it of st.items||[]){ add(it.say); if (it.t==='syll'||it.t==='build'||it.t==='spell') add(it.w); }
      if (st.t==='sort') for (const it of (st.sort&&st.sort.items)||[]) add(it.w); } }
  return out;
}
function kDefOf(path){
  const [a,b]=String(path||'').split('/'); if(!b || !b.startsWith('k-')) return null;
  if(a==='intro') return (kIntroDefs()||[]).find(d=>d.key===b)||null;
  if(a==='lib') return (kLibDefs()||[]).find(d=>d.key===b)||null;
  const L=kLesson(a); if(L) return L.stations.find(d=>d.key===b)||null;
  return kUnitDef(a,b);
}
function kMax(def){ return def && def.info? 1 : 3; }
/* صفحة مسار كتابي، أو undefined إن لم يكن مسارًا من كتابي */
function kPage(path){ const d=kDefOf(path); return d? d.pg : undefined; }
/* هل هذا المسار من «تمرين» (محتوى اللعبة الذي حلّ محلَّه محتوى الكتاب)؟ */
function kIsX(path){
  if(!kOn()) return false; const [a,b]=String(path||'').split('/'); if(!b || b.startsWith('k-')) return false;
  if(a==='intro') return !!kIntroDefs(); if(a==='lib') return !!kLibDefs();
  if(kLesson(a)) return true; const U=kUnit(a); if(!U || b==='task') return false;
  return U.blocks.some(x=>x.replaces===b);
}
/* أهداف خطة بابا المحفوظة بمسارات اللعبة القديمة تُفتح على مقابلها من الكتاب */
function kPlanPath(path){
  if(!kOn() || !path) return path; const [a,b,c]=String(path).split('/'); if(!b || b.startsWith('k-')) return path;
  /* «مهمة الوحدة» العامة ← «أنجز مشروعي» من الكتاب */
  if(b==='task') return (!c && kUnit(a) && EXTRA.projects[a])? `${a}/task/project` : path;
  if(a==='lib'){ return (kLibDefs()||[]).some(d=>d.key==='k-'+b)? `lib/k-${b}` : path; }
  const L=kLesson(a); if(L) return L.stations.some(d=>d.key==='k-'+b)? `${a}/k-${b}` : path;
  const U=kUnit(a); if(U){ const d=U.blocks.find(x=>x.replaces===b); return d? `${a}/${d.key}` : path; }
  return path;
}
function kTaskStrip(ukey, key){ const U=kUnit(ukey); const s=U && U[key]; return (s && kCanShow(s.p))? s : null; }

function kStepListen(g, st, ctx){
  return new Promise(res=>{
    let done=false, plays=0, unlocked=false; const a=new Audio(); a.preload='auto'; a.setAttribute('playsinline','');
    const fin=v=>{ if(done) return; done=true; try{ a.pause(); a.removeAttribute('src'); a.load(); }catch(e){} g.abortCurrent=null; res(v); };
    g.abortCurrent=r=>fin(r);
    const bar=h('i',{}); const time=h('span',{class:'k-time'},'٠٠:٠٠');
    const big=h('button',{class:'k-play', type:'button', 'aria-label':'تشغيل النص المسموع'},'▶️');
    const status=h('div',{class:'feedback info'},'👂 اضْغَطِي ▶️ وَاسْمَعِي جَيِّدًا إِلَى الْآخِرِ.');
    const nextB=h('button',{class:'btn btn-green', disabled:true, onclick:()=>{ Log.ev({k:'listen_end', s:ctx.path, plays, ms:Math.round((a.currentTime||0)*1000)}); fin({ok:true, plays}); }}, st.next||'سَمِعْتُهُ — التَّالِي ←');
    const againB=h('button',{class:'btn', hidden:true, onclick:()=>{ try{ a.currentTime=0; }catch(e){} start(); }},'🔁 مِنَ الْبِدَايَةِ');
    const unlock=()=>{ if(unlocked) return; unlocked=true; nextB.disabled=false; nextB.classList.add('btn-primary'); againB.hidden=false; };
    function start(){ Say.stop(); if(!a.src) a.src=st.audio; const p=a.play(); if(p&&p.catch) p.catch(()=>fail()); }
    function fail(){ status.className='feedback bad'; status.textContent='مَا قَدَرْتُ أُشَغِّلُ الصَّوْتَ. تَأَكَّدِي مِنَ الْإِنْتَرْنِت ثُمَّ اضْغَطِي ▶️ مَرَّةً ثَانِيَةً.'; big.textContent='▶️'; unlock(); Log.ev({k:'listen_fail', s:ctx.path}); }
    big.addEventListener('click', ()=>{ if(a.paused) start(); else a.pause(); });
    a.addEventListener('play', ()=>{ if(a.currentTime<1){ plays++; Log.ev({k:'listen_start', s:ctx.path}); } big.textContent='⏸️'; status.className='feedback info'; status.textContent='🎧 يَشْتَغِلُ الْآنَ… اسْمَعِي جَيِّدًا.'; });
    a.addEventListener('pause', ()=>{ big.textContent='▶️'; });
    a.addEventListener('timeupdate', ()=>{ const d=a.duration||0; bar.style.width= d? (100*a.currentTime/d)+'%' : '0%'; time.textContent=toArK(fmtMs((a.currentTime||0)*1000)); if(d && a.currentTime>=d*0.9) unlock(); });
    a.addEventListener('ended', ()=>{ unlock(); status.className='feedback ok'; status.textContent='أَحْسَنْتِ! سَمِعْتِهِ كَامِلًا 🌟 تَقْدِرِينَ تَسْمَعِينَهُ مَرَّةً ثَانِيَةً.'; });
    a.addEventListener('error', ()=>{ if(a.src) fail(); });
    kAutoSay(st);
    g.body.replaceChildren(...kids(kInstr(st, ctx.vbtn), h('div',{class:'k-player'}, big, h('div',{class:'k-track'}, bar), time), status, st.strips? kStrips(st.strips):null));
    g.foot.replaceChildren(againB, nextB);
  });

/* ---------- خطوة: تسجيل صوتها (جواب شفهي / إنشاد) ---------- */
function kRecorder(g, {head, sendLabel='✅ التَّالِي', skipLabel='⏭️ بِدُونِ تَسْجِيلٍ', allowSkip=true}={}){
  return new Promise(res=>{
    let session=null, rec=null, iv=null, url=null, done=false;
    const fin=v=>{ if(done) return; done=true; clearInterval(iv); if(session){ session.cancel(); session=null; } if(url) URL.revokeObjectURL(url); res(v); };
    g.abortCurrent=r=>fin(r);
    const timer=h('div',{class:'timer'},'00:00'); const status=h('div',{class:'rec-status'},''); const playerWrap=h('div',{class:'row center'});
    g.body.replaceChildren(...kids(head, h('div',{class:'k-recbar'}, status, timer), playerWrap));
    const idle=()=>{ status.replaceChildren(); timer.textContent='00:00'; playerWrap.replaceChildren();
      g.foot.replaceChildren(h('button',{class:'btn btn-primary', onclick:start},'🎙️ ابْدَئِي التَّسْجِيلَ'), allowSkip? h('button',{class:'btn btn-ghost btn-sm', onclick:()=>fin({skip:true})}, skipLabel):null); };
    async function start(){
      Say.stop();
      if(!Rec.support()){ Log.ev({k:'mic_unsupported'}); status.replaceChildren(h('div',{class:'banner'},'🎙️ الْمَايْك لَا يَعْمَلُ فِي هَذَا الْمُتَصَفِّحِ. أَكْمِلِي بِدُونِ تَسْجِيلٍ.')); g.foot.replaceChildren(h('button',{class:'btn', onclick:()=>fin({skip:true})},'أُكْمِلُ بِدُونِ تَسْجِيلٍ ←')); return; }
      try{ session=await Rec.start(); }catch(e){ Log.ev({k:'mic_denied', err:String(e&&e.name||e).slice(0,40)}); status.replaceChildren(h('div',{class:'banner'},'🎙️ مَا قَدَرْتُ أَفْتَحُ الْمَايْك. اطْلُبِي مِنْ بَابَا أَنْ يَسْمَحَ لِلْمَايْك، أَوْ أَكْمِلِي بِدُونِ تَسْجِيلٍ.')); g.foot.replaceChildren(h('button',{class:'btn btn-primary', onclick:start},'🔁 جَرِّبِي مَرَّةً ثَانِيَةً'), h('button',{class:'btn', onclick:()=>fin({skip:true})},'أُكْمِلُ بِدُونِ تَسْجِيلٍ ←')); return; }
      if(done){ session.cancel(); return; }
      const t0=Date.now(); status.replaceChildren(h('span',{class:'rec-dot'}), ' يُسَجِّلُ الْآنَ… تَكَلَّمِي 🗣️'); iv=setInterval(()=>{ timer.textContent=fmtMs(Date.now()-t0); if(Date.now()-t0>240000) stop(); },300);
      g.foot.replaceChildren(h('button',{class:'btn btn-green', onclick:stop},'⏹️ خَلَصْتُ'));
    }
    async function stop(){ clearInterval(iv); const sess=session; session=null; if(!sess) return; rec=await sess.stop(); if(!rec||!rec.blob.size){ toast('مَا سَمِعْتُ شَيْئًا، جَرِّبِي مَرَّةً ثَانِيَةً 🎙️'); idle(); return; }
      status.replaceChildren('🎧 اسْمَعِي نَفْسَكِ. إِذَا أَعْجَبَكِ اضْغَطِي التَّالِي، أَوْ أَعِيدِيهِ.'); if(url) URL.revokeObjectURL(url); url=URL.createObjectURL(rec.blob);
      playerWrap.replaceChildren(h('audio',{controls:'', src:url, style:'width:100%'}));
      g.foot.replaceChildren(h('button',{class:'btn btn-green', onclick:()=>{ const r=rec; rec=null; fin({rec:r}); }}, sendLabel), h('button',{class:'btn', onclick:()=>{ rec=null; idle(); }},'🔁 أُعِيدُ التَّسْجِيلَ'));
    }
    idle();
  });
}

/* ---------- خطوة: لعبة بطاقات (كلمة ومعناها / ضدّها) بكلمات الكتاب ---------- */
function kMemGame(g, st, ctx){
  const pairs=st.pairs; let moves=0, matched=0, flipped=[];
  return new Promise(res=>{
    g.abortCurrent=r=>res(r);
    const cards=shuffle(pairs.flatMap((p,i)=>[{id:i,txt:p.w,kind:'w'},{id:i,txt:p.m,kind:'m'}]));
    const fb=h('div',{class:'feedback info'}, st.opp? 'اقْلِبِي بِطَاقَتَيْنِ: كَلِمَةً وَضِدَّهَا 💎' : 'اقْلِبِي بِطَاقَتَيْنِ: كَلِمَةً وَمَعْنَاهَا 💎');
    const els=cards.map((c,ci)=>h('button',{class:'mcard', onclick:()=>flip(ci)}, h('div',{class:'in'}, h('div',{class:'f'},'💎'), h('div',{class:'b', style:c.kind==='w'?'font-size:1.35rem;font-weight:700':''}, c.txt))));
    function flip(ci){
      const el=els[ci]; if(el.classList.contains('flip')||flipped.length===2) return;
      el.classList.add('flip'); flipped.push(ci); Say.speak(cards[ci].txt);
      if(flipped.length===2){ moves++; const [a,b]=flipped; const okm=cards[a].id===cards[b].id && cards[a].kind!==cards[b].kind;
        Log.ev({k:'mem_pair', s:ctx.path, ok:okm, a:stripT(cards[a].txt).slice(0,20), b:stripT(cards[b].txt).slice(0,20)});
        setTimeout(()=>{ if(okm){ els[a].classList.add('matched'); els[b].classList.add('matched'); matched++; if(matched===pairs.length){ fb.className='feedback ok'; fb.textContent='جَمَعْتِ كُلَّ الْبِطَاقَاتِ! 🎉'; setTimeout(()=>res({ok:true, moves, n:pairs.length}),900);} } else { els[a].classList.remove('flip'); els[b].classList.remove('flip'); } flipped=[]; }, okm?300:900); }
    }
    g.body.replaceChildren(h('div',{class:'mem'},...els), fb); g.foot.replaceChildren();
  });

/* ===================== تشغيل محطة من الكتاب ===================== */
async function kRunSteps(g, def, ctx){
  const t0=Date.now(); const parts=[]; const results=[]; const tally={}; let lastRec=null, readMs=0, memMoves=0, memN=0, skippedLink=false;
  ctx.def=def; const skill=ctx.skill||def.skill||'comp';
  kPrefetch(def);
  setTimeout(()=>{ try{ Say.speak(def.tip); }catch(e){} }, 300);
  const ok=await introCard(g,{emoji:def.icon, title:def.title, tip:def.tip, btn:'يَلَّا نَبْدَأْ 🚀'}); if(ok.aborted) return ok;
  const steps=def.steps;
  for (let i=0;i<steps.length;i++){
    if (g.aborted) return {aborted:true};
    Say.stop(); const st=steps[i]; g.root.classList.toggle('k-stick', st.t!=='ink'); g.setDots(steps.length, i, results); g.cur={i:i+1, n:steps.length, it:(st.label||st.t)}; g.setSrc(ctx.path);
    ctx.last = (i===steps.length-1) && !def.approve;
    ctx.vbtn = (def.videos && i===0) ? kVideosBtn(ctx.vref) : null;
    let r=null;
    if (st.t==='read'){ r=await kStepRead(g, st, ctx); if(r.aborted) return r; lastRec=r.rec||null; readMs=r.ms||0; parts.push({kind:'rec', rec:r.rec||null, label:st.label, strips:null}); }
    else if (st.t==='rec'){ r=await kStepRec(g, st, ctx); if(r.aborted) return r; parts.push({kind:'rec', rec:r.rec, label:st.label, strips:st.strips, key:st.key||''}); }
    else if (st.t==='ink'){ r=await kStepInk(g, st, ctx, i); if(r.aborted) return r; if(!r.skipped) parts.push({kind:'ink', ink:r.id, pen:r.pen, n:r.n, label:st.label, key:st.key||'', keyStrips:st.keyStrips||null}); }
    else if (st.t==='look'){ r=await kStepLook(g, st, ctx); if(r.aborted) return r; }
    else if (st.t==='link'){ r=await kStepLink(g, st, ctx); if(r.aborted) return r; if(r.skipped) skippedLink=true; }
    else if (st.t==='listen'){ r=await kStepListen(g, st, ctx); if(r.aborted) return r; }
    else if (st.t==='items'){ r=await runItems(st.items.map(it=>Object.assign({skill:st.skill||skill}, it)), {g, path:ctx.path, skill:st.skill||skill}); if(r.aborted) return r; kMerge(tally, r.skillTally); }
    else if (st.t==='sort'){ r=await stSort(g, st.sort, ctx.path, {title:st.sort.title}); if(r.aborted) return r; kMerge(tally, r.skillTally); }
    else if (st.t==='mem'){ r=await kMemGame(g, st, ctx); if(r.aborted) return r; memMoves+=r.moves; memN+=r.n; }
    results.push({ok:true});
  }
  g.root.classList.remove('k-stick'); g.setDots(steps.length, steps.length, results); g.cur=null; Say.stop();
  const ms=Date.now()-t0;
  if (def.info){ if(skippedLink) return {aborted:true, quiet:true}; return {acc:1, ms, stars:1, simple:true}; }
  /* بابا موجود؟ يقيّم القراءة الآن (مثل محطة القراءة في اللعبة) */
  if (def.approve){
    const ap=await approvalStep(g,{title:def.approve, ms:readMs||ms, rec:lastRec}); if(ap.aborted) return ap;
    if (!ap.pending){ if(lastRec){ try{ await Rec.save(lastRec,{path:ctx.path, kind:'book', text:stripT(def.title)}); }catch(e){} } Log.ev({k:'read_rated', s:ctx.path, rating:ap.rating, notes:ap.notes}); return {acc:ap.rating/3, ms, stars:ap.rating, total:1, extra:{notes:ap.notes, rec:!!lastRec}}; }
  }
  if (!parts.length){ const acc = memN? clamp(memN*1.6/Math.max(1,memMoves),0,1) : 1; return {acc, ms, skillTally:tally, total:memN||1}; }
  g.body.replaceChildren(h('div',{class:'result'}, h('div',{class:'big-stars'},'📨'), h('h2',{},'جَارٍ إِرْسَالُ عَمَلِكِ لِبَابَا…'), h('p',{class:'small'},'لَحْظَةً وَاحِدَةً ⏳'))); g.foot.replaceChildren();
  const out=[];
  for (const p of parts){
    if (p.kind==='rec'){ let up=null; if(p.rec){ try{ up=await Rec.save(p.rec,{path:ctx.path, kind:'book', text:p.label||stripT(def.title)}); }catch(e){ up=null; } }
      out.push({kind:'rec', label:p.label||'', audio: up? up.id:null, audioType: up? up.type:null, ms: p.rec? p.rec.ms:0, said: !p.rec, strips:p.strips? kPack(p.strips):null, key:p.key||''}); }
    else out.push({kind:'ink', label:p.label||'', ink:p.ink, pen:!!p.pen, n:p.n||0, key:p.key||'', keyStrips:p.keyStrips? kPack(p.keyStrips):null});
  }
  Child.ensure(); S.child.pending=S.child.pending.filter(p=>!(p.type==='book' && p.station===ctx.path && p.status==='pending'));
  await Child.addPending({type:'book', station:ctx.path, lesson:ctx.lesson||'', unit:ctx.unit||'', title:stripT(def.title), pg:def.pg, parts:out, skill, ms});
  Log.ev({k:'book_sent', s:ctx.path, recs:out.filter(x=>x.kind==='rec' && x.audio).length, inks:out.filter(x=>x.kind==='ink').length});
  return {acc:0, ms, pending:true, skillTally:tally, pendingMsgs:['أَرْسَلْتُ عَمَلِي لِبَابَا 📨','بَابَا يَسْمَعُهُ وَيَرَاهُ وَيُعْطِيكِ النُّجُومَ ⭐']};
}
/* يشغّل أي مسار من «كتابي»: درس (u1l1/k-read)، جزء وحدة (u1/k-listen)، المراجعة (intro/k-n1)، أنا أقرأ (lib/k-a1) */
async function kRun(path){
  if (Lock.blocks()) return render();
  const [a]=String(path).split('/'); const def=kDefOf(path);
  let back=()=>go('home'), list=null, title='', ctx={path, lesson:'', unit:'', L:null, vref:null, skill:null};
  if (a==='intro'){ back=()=>go('intro'); list=kIntroDefs(); ctx.lesson='intro'; }
  else if (a==='lib'){ back=()=>go('library'); list=kLibDefs(); ctx.lesson='lib'; }
  else { const f=findLesson(a);
    if (f){ back=()=>go('lesson', a); const L=kLesson(a); list=L? L.stations:null; ctx.lesson=a; ctx.unit=f.unit.key; ctx.L=L; ctx.vref=L? L.videos:null; title=N(lessonTitle(f.lesson));
      if (def && !def.skill && def.sk) ctx.skill=(f.lesson[def.sk] && f.lesson[def.sk].skill) || 'comp'; }
    else { const u=CONTENT.units.find(x=>x.key===a); if(u){ back=()=>go('unit', a); ctx.unit=a; const U=kUnit(a); ctx.vref=U? U.videos:null; title=N(u.title); } } }
  if (!def) return back();
  if (!ctx.skill) ctx.skill=def.skill||'comp';
  Log.ev({k:'station_start', s:path});
  const g=makeGame(`${def.icon} ${def.title}${title? ' — '+title : ''}`); g.setSrc(path);
  let r; try{ r=await kRunSteps(g, def, ctx); }catch(e){ console.error(e); toast('حَدَثَ خَطَأٌ، ارْجِعِي وَجَرِّبِي مَرَّةً ثَانِيَةً'); }
  if (!r || r.aborted){ if(!(r && r.quiet)) Log.ev({k:'station_abort', s:path}); return back(); }
  const idx= list? list.indexOf(def) : -1; const nxt= (list && idx>=0)? list[idx+1] : null;
  const act=await finishStation(g, Object.assign({path, skill:ctx.skill, next: (nxt && !Lock.on())? `التَّالِي: ${nxt.title} ${nxt.icon}` : null}, r));
  if (act==='next' && nxt && !Lock.on()) return kRun(`${a}/${nxt.key}`);
  back();
}
function kRunStation(u, l, key){ return kRun(`${l.key}/${key}`); }
function kRunUnit(u, key){ return kRun(`${u.key}/${key}`); }

/* ---------- سجل كل الحركات (حتى غير المكتمل) ---------- */
function activityOfDay(list){
  const evs=list.flatMap(s=>(s.events||[]).map(e=>Object.assign({sid:s.id}, e)));
  const sts=list.flatMap(s=>(s.stations||[]).map(st=>Object.assign({sid:s.id, k:'station'}, st)));
  return evs.concat(sts).sort((a,b)=>a.t-b.t);
}
function unfinishedOfDay(acts){
  // محطة بدأت ولم تُسجَّل كمكتملة قبل بداية محطة أخرى/نهاية اليوم
  const out=[]; let open=null;
  for (const e of acts){
    if (e.k==='station_start'){ if(open) out.push(open); open={s:e.s, t:e.t, answers:0, wrong:0, last:null, how:'تركتها'}; }
    else if (open && e.k==='answer' && e.s===open.s){ open.answers++; if(!e.ok) open.wrong++; open.last=e.it; }
    else if (open && e.k==='try' && e.s===open.s){ open.wrong++; open.last=e.it; }
    else if (open && e.k==='quit'){ open.how=`ضغطت خروج عند السؤال ${e.at||'?'} من ${e.of||'?'}`; open.it=e.it; }
    else if (open && e.k==='station_abort'){ out.push(open); open=null; }
    else if (open && e.k==='away' && e.s===open.s){ open.away=true; open.it=open.it||e.it; open.at=e.at; open.of=e.of; }
    else if (open && e.k==='station' && e.s===open.s){ open=null; }
  }
  if (open) out.push(open);
  return out.filter(x=>x && (x.answers>0 || x.how!=='تركتها' || x.away || true));
}

function activityCard(list, dayLabel){

function buildInsights(){
  const out=[]; const p=Progress.ensure();
  for (const [k,s] of Object.entries(p.skills||{})){ if(s.total>=6){ const acc=s.ok/s.total; const recent=(s.recent||[]).slice(-3); const rAvg=recent.length? recent.reduce((a,b)=>a+b,0)/recent.length : acc*100; if(rAvg<60) out.push(`${skillName(k)}: الدقة الأخيرة ${Math.round(rAvg)}٪ — تحتاج مراجعة معك قبل الدرس القادم.`); } }
  const ml=Mistakes.list(); if(ml.length>=5) out.push(`في صندوق الأخطاء ${ml.length} سؤالاً. أكثرها تكراراً في: ${[...new Set(ml.slice(0,5).map(m=>skillName(m.skill)))].join('، ')}.`);
  const rd=(p.reading||[]).slice(-5); if(rd.length>=3){ const w=rd.map(r=>r.wpm).filter(Boolean); if(w.length>=3){ const trend=w[w.length-1]-w[0]; out.push(`سرعة القراءة آخر ${w.length} مرات: ${w.join(' ← ')} كلمة/دقيقة (${trend>=0?'تتحسن 📈':'تراجعت 📉'}).`); } }
  const hardTaps=(_sessions||[]).slice(0,10).flatMap(s=>(s.events||[]).filter(e=>e.k==='word_tap').map(e=>e.w)); if(hardTaps.length){ const cnt={}; hardTaps.forEach(w=>cnt[w]=(cnt[w]||0)+1); const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]); out.push(`كلمات احتاجت تسمعها أكثر من مرة: ${top.join('، ')}.`); }
  const today=p.minutesByDay[dayKey()]||0; const goal=(S.settings||DEFAULT_SETTINGS).dailyGoalMin||15; if(today>0 && today<goal) out.push(`لعبت اليوم ${Math.round(today)} دقيقة من هدف ${goal}.`);
  return out.slice(0,5);
}

/* ---------- مراجعة النصوص والصوت (يراجعها بابا أو معلمة؛ لم تُراجَع آليًا للنطق) ---------- */
/* علامات المراجعة في وثيقة مستقلة (state/review): لا تُثقل وثيقة بابا التي يستمع لها جهاز البنت، ولا تُمسح مع «إعادة تعيين التقدم».
   كل المعالجات تقرأ Review.d لحظة الضغط لا مرجعًا مأخوذًا عند الرسم.
   (الخلل السابق: العلامات كانت داخل S.parent، وصدى الحفظ يستبدل S.parent بكائن جديد، فتُكتب الضغطات التالية في كائن متروك وتضيع.) */
const Review = {
  d:null, seq:0, sub:null, onRemote:null,
  norm(d){ d=(d && typeof d==='object' && !Array.isArray(d))? d : {}; for (const k of ['ok','bad']) if (!d[k] || typeof d[k]!=='object' || Array.isArray(d[k])) d[k]={}; return d; },
  busy(){ return !!(Store.chains.review || Store.pending.review); },
  /* علم «على هذا الجهاز ضغطات لم يؤكّد الخادم وصولها» (بلا اعتماد على ساعة الجهاز) */

  /* يضيف إلى d ما في src من علامات غير موجودة فيه (لا يحذف ولا يغيّر الموجود) ويعيد عدد ما أضاف */

  async load(){

    const local=Store.lget('review'), wasDirty=this.dirty(); let remote=null;
    try{ remote=await Store.get('review'); }catch(e){}
    const d=this.norm(remote); let push=false;
    if (wasDirty && local){ if (this.merge(d, local)) push=true; else if (S.mode==='db') this.dirty(false); }   /* ضغطات من هذا الجهاز لم تصل الخادم */
    /* ترحيل العلامات القديمة من وثيقة بابا */
    Parent.ensure(); const old=S.parent.review;
    if (old){ this.merge(d, old); delete S.parent.review; push=true; }
    this.d=d;
    if (push){ this.save(); if (old) Parent.save(); }               /* بدون انتظار الشبكة: الصفحة تُفتح حتى بلا اتصال */
    return d;
  },
  save(){ if (!this.d) return Promise.resolve(); this.d.t=Date.now(); const my=++this.seq; this.dirty(true); const pr=Store.set('review', this.d); if (S.mode==='db') pr.then(()=>{ if (my===this.seq && !Store.failed.review) this.dirty(false); }); return pr; },
  /* علامات وُضعت من جهاز آخر (جوال بابا ثم حاسوبه مثلًا) تصل هنا، فلا يكتب هذا الجهاز فوقها بنسخة قديمة. صدى كتابتنا نحن لا يصل (Store.subscribe يتجاهله). */

    this.sub=Store.subscribe('review', r=>{ if (!r || this.busy()) return; const nd=this.norm(r); const keep= this.dirty() && this.d && this.merge(nd, this.d); this.d=nd; if (keep) this.save(); if (this.onRemote){ try{ this.onRemote(); }catch(e){} } }); }
};
function reviewItems(){
  const out=[]; const A=(typeof AUDIO==='undefined')? {} : AUDIO;
  const add=(kind, text, sub, key)=>{ if(text) out.push({kind, text:N(text), sub:sub||'', key:key||null}); };
  for (const t of Object.keys(A)) add(/\s/.test(t.trim())?'sent':'word', t, '', t);
  const qa=(where, it)=>{ if(!it) return; if(it.t==='mcq'||it.opts) add('qa', it.q, 'الجواب: '+N(it.opts[it.a])+' — '+where); else if(it.t==='order'||it.answer) add('qa', it.q||'ترتيب', 'الجواب: '+N(it.answer||'')+' — '+where); };
  for (const u of CONTENT.units){ (u.warmup.items||[]).forEach(i=>qa(u.title,i)); (u.listening.qs||[]).forEach(i=>qa(u.title,i));
    for (const l of u.lessons){ (l.quiz||[]).forEach(i=>qa(l.title,i)); for(const k of ['style','transform']) ((l[k]||{}).items||[]).forEach(i=>qa(l.title,i)); (l.express||[]).forEach(i=>qa(l.title,i)); ((l.phon||{}).items||[]).forEach(i=>add('qa', (l.phon.q||'')+' ('+i.w+')', 'الجواب: '+N(i.opts[i.a])+' — '+N(l.title))); (l.vocab||[]).forEach(v=>add('qa', v.w, 'المعنى: '+N(v.m)+(v.ant?' · الضد: '+N(v.ant):'')+' · النوع: '+v.type+' — '+N(l.title))); } }
  for (const s2 of CONTENT.library) (s2.qs||[]).forEach(i=>qa(s2.title,i));
  /* ما يُنطق في محطات «كتابي» (ما تسمعه البنت الآن) يُعلَّم بترتيب الكتاب ليُراجَع أولًا */
  const order=new Map(); if (typeof kSpokenTexts==='function'){ for (const t of kSpokenTexts()){ const k=Say.keyOf(t); if (k && !order.has(k)) order.set(k, order.size); } }
  const PREV=(typeof REV_PREV==='undefined')? {} : REV_PREV;
  for (const it of out){ it.id=revId(it); it.prev=PREV[it.id]||null; if (it.key){ it.tok=String(A[it.key]||'').replace(/\.[a-z0-9]+(\?.*)?$/i,'').slice(-8)||1; if (order.has(it.key)) it.book=order.get(it.key); } else it.tok=1; }
  return out;
}
function revId(it){ let x=5381; const t=it.kind[0]+it.text+it.sub; for(let i=0;i<t.length;i++) x=((x<<5)+x+t.charCodeAt(i))>>>0; return x.toString(36); }

    note.onchange=()=>{ const b=Review.d.bad[it.id]; if(b){ b.note=note.value.trim(); persist(); } };
    if (play){ el._play=async()=>{ const ok=await playClip(play, A[it.key]); if (ok===false) toast('تعذّر تشغيل المقطع — تحقّق من الإنترنت ومن مستوى الصوت', 3000); }; play.onclick=el._play; }
    el.append(h('div',{class:'row between', style:'align-items:flex-start;flex-wrap:nowrap'}, h('p',{class:'rv-t'}, it.text), chip), it.sub? h('p',{class:'small'}, it.sub):null, prev, h('div',{class:'row', style:'gap:8px'}, play, yes, no), why);
    drawFns.push(draw); draw(); return el; };
  const nextRow=el=>{ const m=listBox.querySelector('#rv-more'); if (m && !m.hidden && el.nextElementSibling===m) m.click();
    let n=el.nextElementSibling; while (n && !(n.classList.contains('rv') && !n.classList.contains('ok') && !n.classList.contains('bad'))) n=n.nextElementSibling; if(!n) return; try{ n.scrollIntoView({block:'center', behavior:'smooth'}); }catch(e){} if (n._play) n._play(); };

  const EMPTY={todo:'🎉 راجعت كل ما في هذا القسم.', ok:'ما علّمت شيئًا «صحيح» في هذا القسم بعد.', bad:'ما علّمت أخطاء في هذا القسم 👍', fixed:'لا شيء مُصحَّح ينتظر سماعك.'};
  const showTab=b=>{ const row=b && b.parentElement; if(!row || row.scrollWidth<=row.clientWidth) return; const br=b.getBoundingClientRect(), rr=row.getBoundingClientRect(); if (br.left<rr.left || br.right>rr.right) row.scrollLeft += (br.left+br.width/2) - (rr.left+rr.width/2); };
  const redraw=()=>{
    refresh(); drawFns=[]; setTimeout(()=>{ showTab(scopeBtns.find(b=>b._k===_revScope)); showTab(statusBtns.find(b=>b._k===_revStatus)); }, 0);
    let list=all.filter(i=>inScope(i,_revScope) && inStatus(i,_revStatus)); if (_revScope==='book') list=list.slice().sort((a,b)=>a.book-b.book);
    let shown=0; const more=h('button',{class:'btn btn-sm', type:'button', id:'rv-more'});
    const grow=()=>{ const part=list.slice(shown, shown+REV_PAGE); shown+=part.length; more.before(...part.map(rowEl)); const left=list.length-shown; more.hidden=!left; more.textContent=`عرض المزيد (باقي ${left})`; };
    more.onclick=grow;
    listBox.replaceChildren(...(list.length? [more] : [h('div',{class:'empty'}, EMPTY[_revStatus])])); if (list.length) grow();
  };
  setSync(S.mode==='db'? '☁️ متزامن' : '💾 على هذا الجهاز');
  redraw();
  Review.watch(()=>{ refresh(); for (const f of drawFns) f(); });
  return [
    h('div',{class:'card stack', style:'gap:10px'},
      h('div',{class:'row between'}, headTxt, syncEl), h('div',{class:'rv-prog'}, bar),
      h('p',{class:'small'},'اسمع المقطع وقارنه بالنص، ثم ✓ أو ✗. الأخطاء لا تُرسل تلقائيًا: انسخ قائمتها وأرسلها في المحادثة، وبعد التصحيح ترجع لك هنا تحت «🔄 صُحِّحت».'),
      scopeRow, statusRow, fixedNote,
      h('label',{class:'row small', style:'gap:8px', for:'rv-auto'}, autoBox, 'بعد ✓ شغّل المقطع التالي تلقائيًا'),
      copyRow),
    listBox
  ];
}

/* ===================== الإقلاع ===================== */
async function boot(){
  TTS.init(); Say.init(); mountClock(); captureBookCode();
  if (window.PREVIEW) await previewSeed();
  for (const k of ['settings','progress','mistakes','child','parent']) S[k]=Store.lget(k);
  Progress.ensure(); Mistakes.ensure(); Child.ensure(); Parent.ensure();
  if (!S.settings || !S.settings.pinHash) S.screen='setup'; else S.screen='home';
  render();
  const mode = await Store.init();
  /* النسخة المستقلة: إذا Firebase جاهز ولا يوجد رمز عائلة بعد → شاشة الرمز */
  if (mode!=='db' && S.fb && !Family.code()){ renderFamilyGate(); return; }
  if (mode==='db'){
    const keys=['settings','progress','mistakes','child','parent'];
    const vals = await Promise.all(keys.map(k=>Store.get(k)));
    const pushLocal = [];
    keys.forEach((k,i)=>{
      const remote=vals[i], local=S[k];
      if (remote) S[k]=remote;
      else if (local && ((k==='settings'&&local.pinHash)||(k==='progress'&&local.totalStars>0)||(k==='mistakes'&&Object.keys(local.items||{}).length)||(k==='child'&&(local.pending||[]).length)||(k==='parent'&&(local.messages||[]).length))) pushLocal.push(k);
    });
    for (const k of pushLocal) await Store.set(k, S[k]);
    Progress.ensure(); Mistakes.ensure(); Child.ensure(); Parent.ensure();
    /* لا يُعاد رسم الرئيسية إذا كانت محطة شغّالة (المحطات التي تُفتح من الرئيسية تبقي S.screen='home')، وإلا انهدمت المحطة تحت يدها */
    const idle=()=>!document.querySelector('.game');
    Store.subscribe('parent', d=>{ if(d){ S.parent=d; if(S.screen!=='parent') applyParentRatings(); if(S.screen==='home' && idle()) render(); Lock.sync();
      if (S.screen==='parent' && S.nav[0]==='hub' && idle()) renderParent('hub'); } });   /* حالة القفل في لوحة بابا إذا فُتحت اللعبة برمزه من جهازها */
    Store.subscribe('settings', d=>{ if(d){ const had=BookPages.code(); S.settings=d; if(BookPages.code()!==had) BookPages.mem={}; if(S.screen==='home' && idle()) render(); } });
    if (!S.settings || !S.settings.pinHash) S.screen='setup'; else if (S.screen==='setup') S.screen='home';
    if (!document.querySelector('.game')) render();
  }
  /* رمز صفحات الكتاب الخاصة: يُحفظ في إعدادات العائلة فيصل لكل الأجهزة */
  try{ if (await applyBookCode()){ toast('📘 أُضيفت صفحات الكتاب ✅'); if (!document.querySelector('.game') && S.screen==='home') render(); } }catch(e){ console.warn('book code', e); }
  if (restoreClassicKeys() && !PARENT_ONLY){ await Progress.save(); await Child.save(); if (!document.querySelector('.game')) render(); }
  if (PARENT_ONLY){
    /* صفحة لوحة بابا: لا تُسجَّل كجلسة لعب، وتفتح مباشرة على اللوحة إذا كانت مفتوحة في هذه الجلسة */
    /* إن كان بابا قد دخل اللوحة وفتح قسمًا قبل اكتمال التحميل (شبكة بطيئة) فلا نرجعه للصفحة الرئيسية */
    if (S.settings && S.settings.pinHash && S.screen!=='setup'){ if (!Unlock.ok()) renderParentLock(); else if (S.screen!=='parent') go('parent','hub'); }
    return;
  }
  try{ Log.ev({k:'open'}); }catch(e){}
  Lock.sync(); document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) Lock.sync(); });   /* مؤقت الفتح التلقائي + القفل الذي وصل والجهاز نائم */
  await applyParentRatings();
  /* نسخة التجربة: ‎?go=u3 يفتح الوحدة مباشرة */
  if (window.PREVIEW){ try{ const u=new URL(location.href); const gk=u.searchParams.get('go'); if(gk){ u.searchParams.delete('go'); history.replaceState(null,'',u.pathname+u.search+u.hash); if(/^u\d$/.test(gk) && S.screen==='home' && !document.querySelector('.game')) go('unit', gk); } }catch(e){} }
}
/* استرجاع ١٠ نوفمبر: نسخة «مسار الكتاب» نقلت نتائج الألعاب إلى مفاتيح تبدأ بـ x- ؛ هنا نعيدها كما كانت ونزيل ما سجّلته تلك النسخة فقط */
function restoreClassicKeys(){
  let ch=false;
  if (S.progress && S.progress.xmig){
    const P=S.progress; const book=/^(u\d(l\d)?|intro|lib)(\/|$)/;
    for (const fld of ['stars','best']){ const o=P[fld]||{}; const n={}; for (const [k,v] of Object.entries(o)){ if (k.startsWith('x-')) n[k.slice(2)]=v; else if (!book.test(k)) n[k]=v; } P[fld]=n; }
    delete P.xmig; P.totalStars=Object.values(P.stars).reduce((a,b)=>a+b,0); ch=true;
  }
  if (S.child){
    const L=S.child.pending||[]; const keep=L.filter(p=>!p.book); if (keep.length!==L.length){ S.child.pending=keep; ch=true; }
    for (const p of (S.child.pending||[])) if (p.station && String(p.station).startsWith('x-')){ p.station=p.station.slice(2); ch=true; }
    const W=S.child.works||[]; const kw=W.filter(w=>!/^bk\//.test(String(w.id))); if (kw.length!==W.length){ S.child.works=kw; ch=true; }
  }
  return ch;
}
boot().finally(()=>{ S.booted=true; });

/* ===================== شاشة رمز العائلة (النسخة المستقلة) ===================== */
function renderFamilyGate(){
  const inp=h('input',{id:'f-code', placeholder:'مثال: K7PX2M9QD4', class:'ltr', style:'text-align:center;font-size:1.3rem;letter-spacing:2px', autocapitalize:'characters', autocomplete:'off'});
  const err=h('p',{class:'small', style:'color:var(--bad);min-height:20px;text-align:center'},'');
  const join=async()=>{ const c=inp.value.toUpperCase().replace(/[^A-Z0-9]/g,''); if(c.length<10){ err.textContent='الرمز ناقص — انسخه كاملاً من لوحة بابا'; return; } Family.set(c); location.reload(); };
  mount(h('div',{class:'screen'},
    h('div',{class:'hero'}, h('div',{class:'mascot', html:MASCOT_HTML}), h('div',{}, h('h1',{},'رِحْلَةُ لُغَتِي 🌸'), h('p',{class:'small'},'خطوة واحدة لربط هذا الجهاز بلوحة بابا.'))),
    h('div',{class:'card stack'}, h('h3',{},'👨 أنا بابا — أول مرة'), h('p',{class:'small'},'ننشئ رمز عائلة سري جديد، ثم تضبط اسم البنت والرمز السري. بعدها تفتح نفس الرابط على جهازها وتدخل الرمز.'),
      h('button',{class:'btn btn-primary', onclick:()=>{ const c=Family.gen(); Family.set(c); Log.ev({k:'family_new'}); location.reload(); }},'إنشاء عائلة جديدة 🆕')),
    h('div',{class:'card stack'}, h('h3',{},'🔗 عندي رمز العائلة'), h('p',{class:'small'},'اكتب الرمز الموجود في لوحة بابا ← الإعدادات، أو افتح الرابط اللي أرسله بابا وبيدخل تلقائيًا.'), inp, err,
      h('button',{class:'btn btn-green', onclick:join},'ربط هذا الجهاز ✅')),
    h('div',{class:'card sand'}, h('p',{class:'small'},'🎮 تبي تلعب بدون ربط؟ النتائج تنحفظ على هذا الجهاز فقط.'), h('button',{class:'btn btn-sm', onclick:()=>{ Family.set('LOCAL'); location.reload(); }},'ألعب على هذا الجهاز فقط'))
  ));
}
