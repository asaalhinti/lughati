<style>
/* ===== رحلة لغتي — تصميم: عالم صحراوي مشرق (سماء، رمل، نخيل، زعفران)؛ شاشة واحدة عمودية بأزرار كبيرة ===== */
:root{
  /* مظهر واحد مشرق دائماً (لا وضع داكن): سماء صافية، رمل دافئ، زعفران، نخيل */
  --bg:#E3F4FF; --bg-2:#FFF6E3; --surface:#FFFFFF; --sand:#FFF1CC; --sand-2:#FFD98A; --ink:#20304A; --muted:#5E6F84;
  --line:#CFE3F3; --accent:#FF8A1F; --accent-ink:#FFFFFF; --green:#22B573; --sky:#1FA2E6; --rose:#FF5C8A;
  --gold:#FFB800; --purple:#8E5BD6; --ok:#22B573; --bad:#F04B4B; --warn:#E08A00; --shadow:0 10px 24px rgba(32,48,74,.10);
  --u1:#FF8A1F; --u2:#1FA2E6; --u3:#22B573; --u4:#D99A1E; --lib:#8E5BD6; --intro:#FF5C8A;
  --f-display:"Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --f-read:"Noto Naskh Arabic","Amiri","Noto Sans Arabic",serif;
  --r:22px; --r-s:14px; color-scheme:light;
}
html,body{height:100%}
body{margin:0;font-weight:500;background:var(--bg);background-image:linear-gradient(180deg,var(--bg) 0%,var(--bg) 55%,var(--bg-2) 100%);background-attachment:fixed;color:var(--ink);font-family:var(--f-display);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.screen>.topbar{position:relative}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.hidden,[hidden]{display:none!important}
#app{min-height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px}
.screen{display:flex;flex-direction:column;gap:14px;flex:1;animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- شريط علوي ---------- */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;box-shadow:var(--shadow)}
.chip.stars{color:#9A6B00;background:var(--sand)}
.chip .num{font-variant-numeric:tabular-nums}
.spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow)}
.icon-btn:active{transform:scale(.95)}

/* ---------- النخلة ---------- */
.nakhla{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow)}
.nakhla svg{width:54px;height:54px;flex:none}
.meter{flex:1;height:14px;background:var(--line);border-radius:999px;overflow:hidden;position:relative}
.meter > i{display:block;height:100%;background:linear-gradient(90deg,#22B573,#FFB800,#FF8A1F);border-radius:999px;transition:width .6s ease}
.small{font-size:.9rem;color:var(--muted)}
.tiny{font-size:.8rem;color:var(--muted)}

/* ---------- بطاقات العوالم ---------- */
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#FFF1C9 0%,#FFE3EE 55%,#DDF3FF 100%);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.hero .mascot{width:92px;height:92px;flex:none}
.mascot img.mascot-img{width:100%;height:100%;object-fit:cover;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.hero h1{font-size:1.5rem}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-size:1.05rem}
.bubble.msg{background:var(--sand);border-color:var(--sand-2)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.world{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;min-height:150px;text-align:right;box-shadow:var(--shadow);transition:transform .15s}
.world:active{transform:scale(.98)}
.world .w-icon{font-size:2.2rem;line-height:1}
.world .w-title{font-weight:700;font-size:1.15rem}
.world .w-sub{font-size:.85rem;color:var(--muted)}
.world .w-bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:auto}
.world .w-bar i{display:block;height:100%;border-radius:999px;background:var(--c,var(--accent))}
.world.locked{opacity:.6}
.world.locked::after{content:"🔒";position:absolute;top:10px;left:12px;font-size:1.3rem}
.world.c1{--c:var(--u1);background:linear-gradient(160deg,#FFF0DC,#FFD9A8);border-color:#FFC98A} .world.c2{--c:var(--u2);background:linear-gradient(160deg,#E4F4FF,#BFE3FF);border-color:#A9D8FB} .world.c3{--c:var(--u3);background:linear-gradient(160deg,#E4FBEF,#BDF0D5);border-color:#A5E6C4} .world.c4{--c:var(--u4);background:linear-gradient(160deg,#FFF7DE,#FFE8A8);border-color:#F7D985} .world.clib{--c:var(--lib);background:linear-gradient(160deg,#F1E8FF,#DCCBFF);border-color:#CDB8F7} .world.cintro{--c:var(--intro);background:linear-gradient(160deg,#FFE9F0,#FFC9D9);border-color:#FFB3C8}
.world .w-bar{background:rgba(255,255,255,.7)}
.world .w-ring{position:absolute;top:10px;left:12px;width:10px;height:10px;border-radius:50%;background:var(--c)}

/* ---------- المسار (العقد) ---------- */
.trail{display:flex;flex-direction:column;gap:0;position:relative;padding-right:8px}
.node{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:right;width:100%;margin-bottom:10px;box-shadow:var(--shadow);position:relative}
.node:active{transform:scale(.99)}
.node .n-icon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:linear-gradient(160deg,#FFF1CC,#FFD98A);flex:none;border:2px solid var(--sand-2)}
.node:nth-child(3n+2) .n-icon{background:linear-gradient(160deg,#E4F4FF,#BFE3FF);border-color:#A9D8FB} .node:nth-child(3n) .n-icon{background:linear-gradient(160deg,#FFE9F0,#FFC9D9);border-color:#FFB3C8}
.node.done .n-icon{background:var(--green);color:#fff;border-color:var(--green)}
.node .n-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.node .n-title{font-weight:700;font-size:1.1rem}
.node .n-sub{font-size:.85rem;color:var(--muted)}
.node .n-stars{font-size:1rem;letter-spacing:1px;color:var(--gold);flex:none}
.node.locked{opacity:.55}
.node .n-badge{position:absolute;top:-8px;right:14px;background:var(--rose);color:#fff;font-size:.72rem;padding:2px 8px;border-radius:999px;font-weight:700}

/* ---------- أزرار ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 20px;border-radius:999px;font-weight:700;font-size:1.1rem;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-sky{background:var(--sky);color:#fff;border-color:var(--sky)}
.btn-ghost{box-shadow:none;background:transparent}
.btn-sm{min-height:42px;padding:6px 14px;font-size:.95rem}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.card.sand{background:var(--sand);border-color:var(--sand-2)}
.card h3{font-size:1.1rem;margin-bottom:6px}

/* ---------- شاشة اللعب ---------- */
.gamehead{display:flex;align-items:center;gap:10px}
.gamehead .g-title{flex:1;min-width:0;font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.dots i.cur{background:var(--accent);transform:scale(1.3)}
.dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)}
.gamebody{display:flex;flex-direction:column;gap:14px;flex:1}
.prompt{font-family:var(--f-read);font-weight:700;font-size:1.6rem;line-height:2.1;text-align:center;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.prompt .emoji{display:block;font-size:2.6rem;line-height:1.2;font-family:var(--f-display)}
.prompt .tip{display:block;font-family:var(--f-display);font-size:.9rem;color:var(--muted);line-height:1.5;margin-top:4px}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{font-family:var(--f-read);font-weight:700;font-size:1.45rem;line-height:1.9;padding:12px 14px;border-radius:var(--r-s);background:var(--surface);border:3px solid var(--line);text-align:center;min-height:62px;box-shadow:var(--shadow);transition:transform .12s,border-color .2s,background .2s}
.opt:active{transform:scale(.98)}
.opt:nth-child(1){border-color:#9ED6FF} .opt:nth-child(2){border-color:#FFC98A} .opt:nth-child(3){border-color:#A5E6C4} .opt:nth-child(4){border-color:#CDB8F7}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface));animation:shake .35s}
.opt.dim{opacity:.45;pointer-events:none}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:58px}
.tile{font-family:var(--f-read);font-weight:700;font-size:1.6rem;line-height:1.5;min-width:52px;padding:8px 14px;border-radius:14px;background:var(--sand);border:3px solid var(--sand-2);box-shadow:var(--shadow);transition:transform .12s}
.tile:active{transform:scale(.95)}
.tile.letter{min-width:58px;font-size:1.9rem}
.tile.used{visibility:hidden}
.answer-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:70px;background:var(--surface);border:3px dashed var(--line);border-radius:var(--r);padding:10px}
.answer-row .tile{background:var(--surface);border-color:var(--sky)}
.answer-row.ok{border-color:var(--ok);border-style:solid}
.answer-row.bad{border-color:var(--bad);animation:shake .35s}
.word-build{font-family:var(--f-read);font-weight:700;font-size:2.2rem;min-height:64px;letter-spacing:1px;text-align:center;display:flex;align-items:center;justify-content:center;background:var(--surface);border:3px dashed var(--line);border-radius:var(--r);padding:8px}
.word-build.ok{border-color:var(--ok);border-style:solid} .word-build.bad{border-color:var(--bad);animation:shake .35s}
.feedback{min-height:52px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:1.1rem;border-radius:var(--r);padding:8px 14px}
.feedback.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.feedback.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.feedback.info{background:var(--sand);color:var(--ink)}
.gamefoot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding-top:4px}

/* ---------- القصة ---------- */
.story{font-family:var(--f-read);font-weight:700;font-size:1.65rem;line-height:2.4;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);text-align:right}
.story .sent{transition:background .25s;border-radius:8px;padding:2px 4px}
.story .sent.cur{background:color-mix(in srgb,var(--gold) 35%,var(--surface))}
.story .sent.ev{background:color-mix(in srgb,var(--sky) 25%,var(--surface));outline:2px solid var(--sky)}
.story .wd{cursor:pointer;border-radius:6px;padding:0 2px}
.story .wd:active{background:var(--sand)}
.story .wd.hard{background:color-mix(in srgb,var(--rose) 20%,var(--surface))}
.story .nm{color:var(--accent);font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-size:1.6rem;font-weight:800;text-align:center}
.falcon-fly{display:block;margin:0 auto;width:120px;height:60px}
.lines{font-family:var(--f-read);font-weight:700;font-size:1.55rem;line-height:2.5;text-align:center}
.lines .ln{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;border-radius:12px;padding:4px}
.lines .ln.cur{background:color-mix(in srgb,var(--gold) 35%,var(--surface))}
.lines .blank{display:inline-block;min-width:90px;border-bottom:3px dashed var(--accent);color:var(--accent)}

/* ---------- الذاكرة ---------- */
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:420px){.mem{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcard{aspect-ratio:1/1.1;perspective:800px;background:none}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mcard.flip .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:var(--r-s);display:grid;place-items:center;padding:6px;backface-visibility:hidden;border:3px solid var(--line);box-shadow:var(--shadow)}
.mcard .f{background:linear-gradient(160deg,#FF8A1F,#FF5C8A);color:#fff;font-size:2rem}
.mcard .b{background:var(--surface);transform:rotateY(180deg);font-family:var(--f-read);font-weight:700;font-size:1.1rem;line-height:1.7;text-align:center;overflow:hidden}
.mcard.matched .b{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.mcard.matched{opacity:.85}

/* ---------- السلال ---------- */
.baskets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.basket{min-height:86px;border-radius:var(--r);background:var(--sand);border:3px solid var(--sand-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:1.05rem;padding:8px;box-shadow:var(--shadow)}
.basket .cnt{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.basket:nth-child(1){background:linear-gradient(160deg,#FFF1CC,#FFD98A)} .basket:nth-child(2){background:linear-gradient(160deg,#E4F4FF,#BFE3FF);border-color:#A9D8FB} .basket:nth-child(3){background:linear-gradient(160deg,#FFE9F0,#FFC9D9);border-color:#FFB3C8}
.basket.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--sand))}
.basket.bad{border-color:var(--bad);animation:shake .35s}
.bigword{font-family:var(--f-read);font-weight:700;font-size:2.6rem;text-align:center;background:var(--surface);border:3px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);animation:drop .4s ease}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}

/* ---------- الخط ---------- */
.trace-wrap{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);touch-action:none}
.trace-wrap canvas{display:block;width:100%;height:auto;touch-action:none}
.trace-tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- النتيجة ---------- */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px}
.result .big-stars{font-size:3rem;letter-spacing:4px;color:var(--gold);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:none}}
.result h2{font-size:1.5rem}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-10px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}

/* ---------- الصفحة السفلية (sheet) ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:0 max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border-radius:26px;padding:18px;width:100%;max-width:560px;box-shadow:0 -10px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{font-size:1.25rem}
.pin{display:flex;gap:10px;justify-content:center;direction:ltr}
.pin b{width:52px;height:60px;border-radius:14px;border:3px solid var(--line);display:grid;place-items:center;font-size:2rem;background:var(--sand)}
.pin b.on{border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.keypad button{min-height:56px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-size:1.4rem;font-weight:800}
.keypad button:active{background:var(--sand)}
.rating{display:grid;gap:10px}
.rating .opt{font-family:var(--f-display);font-size:1.1rem}

/* ---------- لوحة بابا ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:.95rem}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-s);padding:10px 12px;text-align:center}
.kpi .v{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.78rem;color:var(--muted)}
.tl{display:flex;flex-direction:column;gap:8px}
.tl-item{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-s);padding:10px 12px}
.tl-item .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;min-width:84px;direction:ltr;text-align:right}
.tl-item .b{flex:1;min-width:0}
.tl-item .b b{display:block}
.tl-item .st{color:var(--gold)}
.tl-item details{margin-top:4px}
.tl-item summary{cursor:pointer;color:var(--sky);font-size:.85rem}
.ev{font-size:.85rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;padding:2px 0;border-bottom:1px dashed var(--line)}
.ev .ok{color:var(--ok)} .ev .bad{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 48px;gap:8px;align-items:center;font-size:.9rem}
@media (max-width:420px){.bar{grid-template-columns:120px 1fr 44px}}
.bar .trk{height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.bar .trk i{display:block;height:100%;border-radius:999px;background:var(--green)}
.bar .trk i.mid{background:var(--warn)} .bar .trk i.low{background:var(--bad)}
.bar .pct{font-variant-numeric:tabular-nums;text-align:left;direction:ltr;color:var(--muted)}
.cols{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.cols .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.cols .col i{display:block;width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--sky);min-height:2px}
.cols .col i.goal{background:var(--green)}
.cols .col span{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.table{width:100%;border-collapse:collapse;font-size:.92rem}
.table th,.table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
.table th{color:var(--muted);font-weight:700;font-size:.82rem}
.table td.num{font-variant-numeric:tabular-nums}
.stickers{display:flex;gap:8px;flex-wrap:wrap}
.sticker{font-size:1.8rem;width:56px;height:56px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
.sticker.on{border-color:var(--accent);background:var(--sand)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery figure{margin:0;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.gallery img{display:block;width:100%;height:auto;background:#fff}
.gallery figcaption{font-size:.75rem;color:var(--muted);padding:6px 8px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--sand);color:var(--ink)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.banner{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--warn) 15%,var(--surface));border:2px solid var(--warn);border-radius:var(--r-s);padding:10px 12px;font-size:.92rem}
.banner.ok{background:color-mix(in srgb,var(--ok) 12%,var(--surface));border-color:var(--ok)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.95rem}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:70;box-shadow:var(--shadow);animation:up .25s ease}
.empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:.95rem}
.muted{color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- اكتبي ولوّني ---------- */
.palette{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line),var(--shadow)}
.swatch.on{transform:scale(1.15);box-shadow:0 0 0 3px var(--ink)}
.crayons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.crayon{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface);border:3px solid var(--line);font-weight:700}
.crayon i{width:18px;height:18px;border-radius:50%;background:var(--c);display:inline-block}
.crayon.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.cwords{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:380px){.cwords{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cw{font-family:var(--f-read);font-weight:700;font-size:1.5rem;line-height:1.8;padding:10px 6px;border-radius:var(--r-s);background:var(--surface);border:3px solid var(--line);box-shadow:var(--shadow);min-height:60px}
.cw.ok{border-color:var(--ok)} .cw.bad{border-color:var(--bad);animation:shake .35s}
.art{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:8px;box-shadow:var(--shadow)}
.art svg{width:100%;height:auto;display:block;touch-action:manipulation}
.art svg [data-r]{cursor:pointer}

/* ---------- شريط اليوم والتاريخ والساعة (مثبت أعلى اللعبة) ---------- */
#clockbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;justify-content:center;align-items:center;gap:6px 14px;flex-wrap:wrap;max-width:760px;margin:0 auto;padding:6px max(16px,env(safe-area-inset-left,0px));background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:2px solid var(--line);font-weight:800;font-size:.92rem;color:var(--ink);box-shadow:0 4px 14px rgba(32,48,74,.08)}
#clockbar:empty{display:none}
#clockbar .c-day{color:var(--ink)} #clockbar .c-hijri{color:var(--muted);font-weight:700} #clockbar .c-time{color:var(--accent);font-variant-numeric:tabular-nums;direction:rtl}
@media (max-width:420px){#clockbar{font-size:.84rem;gap:4px 10px}}

/* ---------- المصدر من الكتاب ---------- */
.srcnote{text-align:center;font-size:.8rem;color:var(--muted);padding:6px 10px;border-top:1px dashed var(--line);margin-top:4px}
.pg{display:inline-block;margin-top:2px;align-self:flex-start;padding:1px 9px;border-radius:999px;font-size:.74rem;font-weight:700;background:#EEF6FF;color:#2B6CB0;border:1px solid #CFE3F3}
.pg.extra{background:#FFF1F5;color:#B5386A;border-color:#FFC9D9}
.world .w-pg{font-size:.74rem;font-weight:700;color:#2B6CB0;background:rgba(255,255,255,.75);border-radius:999px;padding:1px 8px;align-self:flex-start}

/* ---------- لمبة درس اليوم ---------- */
.lamp{position:absolute;top:-11px;left:12px;display:inline-flex;align-items:center;gap:4px;background:var(--gold);color:#3B2A00;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:800;box-shadow:0 0 0 3px #fff,0 0 14px rgba(255,184,0,.8);animation:glow 1.4s ease-in-out infinite;z-index:2}
.lamp.off{background:var(--green);color:#fff;animation:none;box-shadow:0 0 0 3px #fff}
.lit{border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(255,184,0,.35),0 10px 24px rgba(255,184,0,.25)!important}
.lit-done{border-color:var(--green)!important}
.world.lit .w-ring,.world.lit-done .w-ring{display:none}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px #fff,0 0 8px rgba(255,184,0,.5)}50%{box-shadow:0 0 0 3px #fff,0 0 22px rgba(255,184,0,1)}}
.card.plan{border-width:3px;border-color:var(--gold)}
.card.plan.done{border-color:var(--green)}
.plan-it.done{opacity:.8}

/* ---------- آية كريمة / دليل الوحدة / قراءة الآيات ---------- */
.verse{background:linear-gradient(160deg,#FFF9E8,#FFF1CC);border:3px double #D4A017;border-radius:var(--r);padding:18px 16px;text-align:center;box-shadow:var(--shadow)}
.verse .v-text{font-family:var(--f-read);font-weight:700;font-size:1.6rem;line-height:2.3;color:#3B2A00}
.verse .v-ref{margin-top:8px;font-size:.9rem;color:var(--muted);font-weight:700}
.guide{margin:0;padding:0 18px 0 0;display:flex;flex-direction:column;gap:8px;font-family:var(--f-read);font-weight:700;font-size:1.15rem;line-height:1.9}
.guide li::marker{content:"⭐ "}
.story.quran{text-align:center;line-height:2.6}
.story.quran .aya{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid #D4A017;color:#8A6A00;font-size:.85rem;font-family:var(--f-display);vertical-align:middle}
.prompt.oral{font-size:1.35rem}

/* ---------- لوحة بابا: الصفحة الرئيسية ---------- */
.need{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.need:last-child{border-bottom:0}
.need .need-ic{font-size:1.5rem;flex:none}
.need .need-b{flex:1;min-width:0;display:flex;flex-direction:column}
.need .need-b b{font-size:.98rem}
.need.ok .need-ic{color:var(--ok)}
.ptiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.ptiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ptile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:right;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;min-height:120px;box-shadow:var(--shadow);transition:transform .12s}
.ptile:active{transform:scale(.98)}
.ptile .pt-ic{font-size:1.8rem;line-height:1}
.ptile .pt-t{font-weight:800;font-size:1.02rem}
.ptile .pt-d{font-size:.78rem;color:var(--muted);line-height:1.4}
.ptile .pt-badge{position:absolute;top:10px;left:12px;min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--rose);color:#fff;font-weight:800;font-size:.85rem;display:grid;place-items:center}
.ptile:nth-child(1){background:linear-gradient(160deg,#FFF6E3,#FFEBC2)} .ptile:nth-child(2){background:linear-gradient(160deg,#E4FBEF,#CDF3DF)} .ptile:nth-child(3){background:linear-gradient(160deg,#FFF9E0,#FFF0B8)} .ptile:nth-child(4){background:linear-gradient(160deg,#E4F4FF,#CFE9FF)} .ptile:nth-child(5){background:linear-gradient(160deg,#FFE9F0,#FFD6E2)} .ptile:nth-child(6){background:linear-gradient(160deg,#F1E8FF,#E3D5FF)} .ptile:nth-child(7){background:linear-gradient(160deg,#F2F5F8,#E6EBF0)}

/* ---------- التسجيل الصوتي ---------- */
.rec-status{display:flex;align-items:center;justify-content:center;gap:8px;min-height:28px;font-weight:800;color:var(--rose)}
.rec-dot{width:14px;height:14px;border-radius:50%;background:#F04B4B;display:inline-block;animation:blink 1s ease-in-out infinite;box-shadow:0 0 0 4px rgba(240,75,75,.25)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.rec-box{display:flex;flex-direction:column;gap:10px}
audio{width:100%;max-width:520px;height:44px}

/* زر الصوت ينبض أثناء التشغيل */
.btn.speaking{animation:speakPulse .9s ease-in-out infinite;box-shadow:0 0 0 4px rgba(255,170,60,.35)}
@keyframes speakPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* سجل الحركات */
.acts{display:flex;flex-direction:column;gap:4px}
.act{display:grid;grid-template-columns:52px 26px 1fr;gap:6px;align-items:start;padding:6px 8px;border-radius:10px;background:var(--surface);font-size:.95rem;line-height:1.5}
.act .t{font-size:.8rem;color:#777;direction:ltr;text-align:right}
.act .ic{text-align:center}
.act.ok{background:#EEF9F1}.act.bad{background:#FDEDEE}.act.warn{background:#FFF4E0}.act.start{background:#EAF3FF}.act.done{background:#F1EAFE}
.act .muted{color:#777;font-size:.88rem}

/* ===================== الكتابة بالقلم ===================== */
.ink{display:flex;flex-direction:column;gap:8px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ink-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:0;z-index:5;background:var(--surface,#fff);border:2px solid var(--line,#d8e6f3);border-radius:16px;padding:6px 8px}
.ink-b{min-width:46px;height:46px;border-radius:12px;border:2px solid var(--line,#d8e6f3);background:#fff;font-size:1.25rem;font-family:inherit;cursor:pointer;padding:0 8px}
.ink-b.wide{font-size:.85rem;font-weight:700}
.ink-b.on{border-color:#FF8A1F;background:#FFF1E0}
.ink-b:disabled{opacity:.4}
.ink-dot{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line,#d8e6f3);cursor:pointer;padding:0}
.ink-dot.on{box-shadow:0 0 0 3px #FF8A1F}
.ink-status{font-size:.8rem;color:#2E7D32;font-weight:700;margin-inline-start:auto}
.ink-view{position:relative;border-radius:16px;border:2px solid #cfe0ef;background:#fff;overflow:hidden}
.ink-view.zoomed{overflow:auto;max-height:72vh;-webkit-overflow-scrolling:touch}
.ink-size{position:relative}
.ink-inner{position:absolute;top:0;left:0;transform-origin:0 0;background:#fff}
.ink-content{position:absolute;inset:0;padding:16px 20px 28px;box-sizing:border-box;color:#1b2a41;font-family:'Noto Sans Arabic',system-ui,sans-serif;pointer-events:none}
.ink-cv{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none}
.ink.ro .ink-cv{touch-action:pan-y}
.ib{box-sizing:border-box;overflow:hidden;white-space:nowrap}
.ib-title{font-weight:800;display:flex;align-items:center;justify-content:center;color:#12355b}
.ib-note{white-space:normal;font-size:24px;line-height:40px;font-weight:700;color:#8a4b00;background:#FFF6E5;border-radius:12px;padding:8px 14px}
.ib-model{display:flex;align-items:center;justify-content:center;font-family:'Noto Naskh Arabic','Noto Sans Arabic',serif;font-weight:700;color:#12355b;background:#EEF6FF;border-radius:12px}
.il-row{position:relative;height:120px}
.il-row .il-base{position:absolute;left:0;right:0;top:88px;border-top:3px solid #7fb2e5}
.il-row .il-mid{position:absolute;left:0;right:0;top:44px;border-top:2px dashed #d5e6f7}
.il-dict .il-base,.il-dict .il-mid{right:118px}
.il-say{position:absolute;right:0;top:30px;width:64px;height:64px;border-radius:50%;background:#FFE7C7;border:3px solid #FFB866;display:flex;align-items:center;justify-content:center;font-size:30px;pointer-events:auto}
.il-say.speaking{background:#FFD08A}
.il-num{position:absolute;right:76px;top:44px;font-size:28px;color:#5b7a99}
.il-key{position:absolute;left:4px;top:2px;color:#2E7D32;font-weight:700}
.im-row{height:96px;display:flex;align-items:center;gap:10px}
.im-box{height:70px;display:flex;align-items:center;justify-content:center;border:3px solid #cfe0ef;border-radius:14px;font-weight:700;overflow:hidden;padding:0 8px;box-sizing:border-box}
.im-box.r{width:240px;background:#EEF6FF}.im-box.l{width:370px;background:#F3FBF1}
.im-gap{flex:1}
.im-dot{width:16px;height:16px;border-radius:50%;background:#5b7a99;flex:none}
.ib-circle{display:flex;flex-wrap:wrap;white-space:normal}
.ic-w{width:25%;height:96px;display:flex;align-items:center;justify-content:center;font-weight:700}
.it-q{height:60px;display:flex;align-items:center;font-weight:800}
.it-o{height:78px;display:flex;align-items:center;gap:16px}
.it-box{width:46px;height:46px;border:3px solid #5b7a99;border-radius:10px;flex:none;background:#fff}
.work-card .ink{margin-top:6px}
.pill.ind{background:#E4F5E1;color:#1b5e20}.pill.help{background:#FFF1D6;color:#8a4b00}.pill.shown{background:#FDE3E3;color:#b71c1c}

/* ===== كتابي: صفحات الكتاب نفسه داخل اللعبة ===== */
/* بلا حدّ ولا حشو: نسب موضع الصورة (top/left %) تُحسب من ارتفاع وعرض الصندوق نفسه فتكون القصّة دقيقة */
.k-strip{position:relative;overflow:hidden;width:100%;background:#fff;border:0;padding:0;border-radius:14px;box-shadow:0 0 0 2px var(--line),var(--shadow)}
.k-strip:not(.ready){background:linear-gradient(100deg,#EEF4FA 40%,#FFFFFF 50%,#EEF4FA 60%);background-size:200% 100%;animation:kshim 1.3s linear infinite}
@keyframes kshim{to{background-position:-200% 0}}
.k-img{position:absolute;max-width:none;height:auto;display:block;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none;pointer-events:none}
.k-miss{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:8px 14px;font-size:.95rem;font-weight:700;color:#8a4b00;background:var(--sand);white-space:normal;line-height:1.6}
.k-strips{display:flex;flex-direction:column;gap:8px}
.k-strip.mini{border-radius:10px;box-shadow:0 0 0 1px var(--line)}
.k-instr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.k-sayb{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--sand-2);background:#fff;font-size:1.25rem;box-shadow:var(--shadow)}
.k-sayb.speaking{animation:speakPulse .9s ease-in-out infinite;box-shadow:0 0 0 4px rgba(255,170,60,.35)}
.k-player{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow);direction:ltr}
.k-play{flex:none;width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:2rem;box-shadow:0 8px 18px rgba(255,138,31,.35)}
.k-play:active{transform:scale(.96)}
.k-track{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.k-track i{display:block;height:100%;width:0;background:var(--green);border-radius:999px;transition:width .25s linear}
.k-time{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.1rem;min-width:56px;text-align:center}
.k-recbar{display:flex;flex-direction:column;align-items:center;gap:2px}
.k-tabs{display:flex;gap:8px}
.k-tab{flex:1;min-height:52px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:1.08rem;box-shadow:var(--shadow)}
.k-tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.k-video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.k-video:empty{display:none}
.k-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.k-vbtn{font-family:var(--f-display);font-size:1rem;line-height:1.6;text-align:right;min-height:52px}
.k-preview{border-color:#8E5BD6;background:#F4EEFF}
.k-part{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--line);border-radius:12px;padding:8px 10px}
.k-key{white-space:pre-line;background:var(--ok-bg,#EAF7E8);border-radius:10px;padding:6px 10px}
.ib-pg{position:relative;overflow:hidden;background:#fff;white-space:normal}
/* في خطوات القراءة والتسجيل والاستماع تبقى الأزرار ظاهرة أسفل الشاشة مهما طالت صفحة الكتاب (أما الكتابة بالقلم فأزرارها في آخر الورقة حتى لا تُضغط براحة اليد) */
.game.k-stick .gamefoot{position:sticky;bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:20;background:rgba(255,255,255,.94);border:2px solid var(--line);border-radius:28px;padding:8px 10px;box-shadow:0 8px 24px rgba(32,48,74,.18)}
.game.k-stick .gamefoot:empty{display:none}
.k-ribbon{position:fixed;top:max(4px,env(safe-area-inset-top,0px));left:8px;z-index:45;background:#8E5BD6;color:#fff;font-size:.74rem;font-weight:800;padding:2px 10px;border-radius:999px;opacity:.92;pointer-events:none;box-shadow:var(--shadow)}

/* كتابي: مؤشر تحميل صفحة الكتاب حتى تظهر الصورة */
.k-strip:not(.ready)::after,.ib-pg:not(.ready)::after{content:'⏳ جَارٍ فَتْحُ صَفْحَةِ الْكِتَابِ…';position:absolute;inset:0;display:grid;place-items:center;color:#6b7c93;font-size:.95rem;pointer-events:none}
.ib-pg{position:relative}

/* ---------- لوحة بابا: مراجعة النصوص والصوت ---------- */
.rv{padding:10px 12px;display:flex;flex-direction:column;gap:8px;transition:background .15s,border-color .15s}
.rv.ok{background:#E9F8F0;border-color:#22B573}
.rv.bad{background:#FDECEC;border-color:#F04B4B}
.rv.fixed{background:#EAF5FD;border-color:var(--sky)}
.rv .rv-t{font-size:1.25rem;font-weight:700;line-height:1.7;min-width:0;overflow-wrap:anywhere}
.rv-st{flex:none;font-size:.8rem;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap;color:#fff;background:#3B6FA8}
.rv.ok .rv-st{background:#14804F} .rv.bad .rv-st{background:#D63333}
.rv-b{min-height:46px;min-width:92px;padding:6px 16px;border-radius:999px;font-weight:800;font-size:1rem;border:2px solid;background:var(--surface);touch-action:manipulation;transition:transform .1s}
.rv-b:active{transform:scale(.95)}
.rv-b.y{border-color:#14804F;color:#117A4B} .rv-b.y.on{background:#14804F;color:#fff}
.rv-b.n{border-color:#D63333;color:#C62F2F} .rv-b.n.on{background:#D63333;color:#fff}
.rv-play{touch-action:manipulation}
.rv-why{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rv-chip{min-height:38px;padding:5px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:.88rem;touch-action:manipulation}
.rv-chip.on{background:#D63333;border-color:#D63333;color:#fff}
.rv-note{font-size:.95rem;padding:8px 12px}
.rv-prog{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.rv-prog i{display:block;height:100%;width:0;background:var(--green);border-radius:999px;transition:width .25s}

/* ---------- قفل اللعبة ---------- */
.lockcard{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:30px 18px;margin-top:6vh;border-width:3px;border-color:var(--sand-2);background:var(--sand)}
.lockcard .lock-ic{font-size:4.2rem;line-height:1}
.lockcard h2{font-size:1.7rem}
.lockcard .lock-msg{font-size:1.3rem;font-weight:700;line-height:1.8;overflow-wrap:anywhere}
.lockcard .lock-until{font-size:1.05rem;color:var(--muted);font-weight:700}
.lockrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px}
.lockrow.on{background:#FDECEC;border-color:var(--bad)}
.lockrow .need-b{flex:1;min-width:170px;display:flex;flex-direction:column}

7cd8e-a1af-4f9b-a7f7-358d28aae517/generated/d3e1622c-1150-44a8-b407-87f4862b83ff.mp3", "فِي أُسْبُوعِ الشَّجَرَةِ، وَقَفَتْ سديم أَمَامَ زَمِيلَاتِهَا وَقَالَتْ: سَأَصِفُ لَكُنَّ شَجَرَةً، فَخَمِّنَّ مَنْ أَنَا.": "https://media.hallah.ai/eaf7cd8e-a1af-4f9b-a7f7-358d28aae517/generated/6a5b0726-26c4-4059-8354-f45417a4bc4d.mp3", "أَصْبِرُ عَلَى الْحَرِّ وَقِلَّةِ الْمَاءِ، وَأُعْطِي ثَمَرًا حُلْوًا يُحِبُّهُ الصِّغَارُ وَالْكِبَارُ.": "https://media.hallah.ai/eaf7cd8e-a1af-4f9b-a7f7-358d28aae517/generated/d2336a4c-7156-40da-ace2-b24852b7f34e.mp3", "مِنْ سَعَفِي تُصْنَعُ السِّلَالُ وَالْحُصُرُ، وَمِنْ جِذْعِي كَانَتْ تُبْنَى الْبُيُوتُ قَدِيمًا.": "https://media.hallah.ai/eaf7cd8e-a1af-4f9b-a7f7-358d28aae517/generated/036232b3-f8d0-41e0-bd80-f4add02a7fbb.mp3", "صَاحَتِ الزَّمِيلَاتُ مَعًا: أَنْتِ النَّخْلَةُ! فَقَالَتْ سديم: أَحْسَنْتُنَّ، النَّخْلَةُ رَمْزُ بِلَادِي.": "https://media.hallah.ai/eaf7cd8e-a1af-4f9b-a7f7-358d28aae517/generated/e3426c90-b60a-444c-b085-4d46542839bb.mp3", "فِي يَوْمِ الْخَمِيسِ، قَالَ الْأَبُ: سَنَزُورُ الْعَمَّ سَعِيدًا فِي مَزْرَعَتِهِ.": "https://media.hallah.ai/eaf7cd8e-a1af-4f9b-a7f7-358d28aae517/generated/c5c4b3d0-6e19-4d44-a486-231c29e08088.mp3", "فَرِحَ الْأَوْلَادُ، وَسَاعَدَتِ الْأُمُّ فِي تَجْهِيزِ الطَّعَامِ.": "https://media.hallah.ai/eaf7cd8e-a1af-4f9b-a7f7-358d28aae517/generated/1ea1b007-fc55-466d-8790-c91ea21d61fa.mp3", "فِي الْمَزْرَعَةِ، اسْتَقْبَلَهُمُ الْعَمُّ سَعِيدٌ بِابْتِسَامَةٍ، وَقَدَّمَ لَهُمُ التَّمْرَ وَالْقَهْوَةَ.": "https://media.hallah.ai/eaf7cd8e-a1af-4f9b-a7f7-358d28aae517/generated/97d3cecd-674f-47bf-9ebc-cb98296ff5c8.mp3", "لَعِبَ الْأَوْلَادُ مَعَ أَبْنَاءِ عَمِّهِمْ تَحْتَ النَّخْلِ، وَرَكِبُوا الْخَيْلَ.": "https://media.hallah.ai/eaf7cd8e-a1af-4f9b-a7f7-358d28aae517/generated/27ef0aea-2048-488f-8282-0df348705164.mp3", "قَبْلَ الْمَغْرِبِ، شَكَرَتِ الْعَائِلَةُ الْعَمَّ، وَقَالَ الْأَبُ: صِلَةُ الرَّحِمِ تَزِيدُ الْمَحَبَّةَ بَيْنَنَا.": "https://media.hallah.ai/eaf7cd8e-a1af-4f9b-a7f7-358d28aae517/gen const TTS = {

  available(){ return ('speechSynthesis' in window); },
  speak(text, opts={}){
    return new Promise(res=>{
      if(!('speechSynthesis' in window)){ res(false); return; }
      const ss=speechSynthesis;
      /* سفاري/آيفون: cancel() قبل speak() مباشرة قد يُسقط النطق — نلغي فقط إذا كان هناك نطق جارٍ */
      try{ if(ss.speaking || ss.pending) ss.cancel(); }catch(e){}
      const clean = N(text).replace(/[{}]/g,'');
      const u = new SpeechSynthesisUtterance(clean); this._u=u; /* نحتفظ بالمرجع حتى لا يُجمَع قبل النهاية */
      const v=this.voice(); if(v) u.voice=v; u.lang=(v&&v.lang)||'ar-SA'; u.rate=opts.rate||0.82; u.pitch=1.05;
      let done=false, started=false; const fin=ok=>{ if(done) return; done=true; res(ok); };
      u.onstart=()=>{ started=true; }; u.onboundary=()=>{ started=true; };
      u.onend=()=>fin(true); u.onerror=()=>fin(false);
      try{ ss.speak(u); }catch(e){ fin(false); return; }

      setTimeout(()=>{ if(!started && !done){ try{ if(ss.paused) ss.resume(); }catch(e){} setTimeout(()=>{ if(!started) fin(false); }, 1200); } }, 1800);

const S = { settings:null, progress:null, mistakes:null, child:null, parent:null, mode:'local', dbReady:false, assets:null, blobMode:'claude', fb:false, screen:'home', nav:[] };
const childName = () => (S.settings && S.settings.childName) || 'الْبَطَلَة';
const N = s => String(s).replace(/\{N\}/g, childName());

/* ===================== رمز العائلة (يربط جهاز البنت بجهاز بابا في النسخة المستقلة) ===================== */
const Family = {
  ALPHA:'ABCDEFGHJKLMNPQRSTUVWXYZ23456789',
  /* يقرأ الكود من الرابط (?f=) ويحفظه، ويُبقي الكود في الرابط دائمًا حتى تحفظه أيقونة الشاشة الرئيسية والمفضلة */
  code(){ try{
    const u=new URL(location.href); const f=(u.searchParams.get('f')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(f.length>=10) localStorage.setItem(LSP+'family', f);
    const c=localStorage.getItem(LSP+'family')||'';
    if(c && c!=='LOCAL' && u.searchParams.get('f')!==c){ u.searchParams.set('f', c); history.replaceState(null,'',u.pathname+u.search+u.hash); }
    return c; }catch(e){ return ''; } },
  set(c){ try{ const v=String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,''); localStorage.setItem(LSP+'family', v); const u=new URL(location.href); if(v && v!=='LOCAL') u.searchParams.set('f', v); else u.searchParams.delete('f'); history.replaceState(null,'',u.pathname+u.search+u.hash); }catch(e){} },
  clear(){ try{ localStorage.removeItem(LSP+'family'); const u=new URL(location.href); u.searchParams.delete('f'); history.replaceState(null,'',u.pathname+u.search+u.hash); }catch(e){} },
  gen(){ let out=''; const a=new Uint32Array(12); crypto.getRandomValues(a); for(const n of a) out+=this.ALPHA[n%this.ALPHA.length]; return out; },
  /* رابط اللعبة (جهاز البنت) ورابط لوحة بابا — صفحتان منفصلتان على نفس الموقع */
  base(){ let p=location.pathname.replace(/[^/]*$/,''); p=p.replace(/parent\/$/,''); return location.origin + p; },
  link(code){ return this.childLink(code); },
  q(code){ const c=code||this.code(); return (c && c!=='LOCAL') ? '?f='+c : ''; },
  childLink(code){ return this.base() + this.q(code); },
  parentLink(code){ return this.base() + 'parent/' + this.q(code); }
};
const PARENT_ONLY = !!window.PARENT_ONLY;
const Unlock = {
  ok(){ try{ return sessionStorage.getItem(LSP+'unlocked')==='1'; }catch(e){ return false; } },
  set(v){ try{ if(v) sessionStorage.setItem(LSP+'unlocked','1'); else sessionStorage.removeItem(LSP+'unlocked'); }catch(e){} }
};

/* ===================== محوّل Firestore: نفس واجهة قاعدة بيانات الصفحة (doc/collection) ===================== */
function fbAdapter(FB, code){
  const app = FB.initializeApp(window.FIREBASE_CONFIG);
  let fsdb; try{ fsdb = FB.initializeFirestore(app, {localCache: FB.persistentLocalCache({tabManager: FB.persistentMultipleTabManager()})}); }catch(e){ fsdb = FB.getFirestore(app); }
  const base = 'families/'+code+'/';
  const wrapSnap = sn => ({ id:sn.id, exists: sn.exists(), data(){ return sn.data(); } });
  const docRef = p => ({ id: p.split('/').pop(), path:p,
    async get(){ return wrapSnap(await FB.getDoc(FB.doc(fsdb, base+p))); },
    set(d){ return FB.setDoc(FB.doc(fsdb, base+p), JSON.parse(JSON.stringify(d))); },
    delete(){ return FB.deleteDoc(FB.doc(fsdb, base+p)); },
    onSnapshot(cb, err){ return FB.onSnapshot(FB.doc(fsdb, base+p), sn=>cb(wrapSnap(sn)), err); },
    collection(c){ return collRef(p+'/'+c); } });
  const collRef = (c, ob=null, lim=200) => ({
    orderBy(f,dir){ return collRef(c,[f,dir||'asc'],lim); }, limit(n){ return collRef(c,ob,n); },
    async get(){ const parts=[FB.collection(fsdb, base+c)]; if(ob) parts.push(FB.orderBy(ob[0], ob[1])); parts.push(FB.limit(lim)); const q=FB.query(...parts); const res=await FB.getDocs(q); return {docs: res.docs.map(wrapSnap), size:res.size, empty:res.empty}; },
    doc(id){ return docRef(c+'/'+id); } });
  return { doc: docRef, collection: c=>collRef(c), raw: fsdb };
}

/* ===================== ملفات (تسجيلات/صور) داخل Firestore مقسّمة إلى أجزاء ===================== */
const Blobs = {
  PART: 700000, cache:{},
  b64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=rej; r.readAsDataURL(blob); }); },
  async upload(blob, opts={}){
    const type=(opts.type||blob.type||'application/octet-stream'); const id=uid()+uid();
    const data=await this.b64(blob); const n=Math.ceil(data.length/this.PART)||1;
    for(let i=0;i<n;i++) await Store.db.doc(`blobs/${id}/parts/${i}`).set({b64:data.slice(i*this.PART,(i+1)*this.PART)});
    await Store.db.doc('blobs/'+id).set({type, size:blob.size, parts:n, ts:Date.now()});
    return {id, url:'fsblob:'+id, sizeBytes:blob.size, contentType:type};
  },
  async url(id){
    if (!id) return null; if (this.cache[id]) return this.cache[id];
    if (S.blobMode!=='fs') return '/_blob/'+id;
    const meta=await Store.db.doc('blobs/'+id).get(); if(!meta.exists) return null; const m=meta.data();
    let data=''; for(let i=0;i<(m.parts||1);i++){ const pt=await Store.db.doc(`blobs/${id}/parts/${i}`).get(); if(pt.exists) data+=pt.data().b64||''; }
    const bin=atob(data); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    const u=URL.createObjectURL(new Blob([arr],{type:m.type||'application/octet-stream'})); this.cache[id]=u; return u;
  },
  async delete(id){ try{ if(S.blobMode!=='fs'){ if(S.assets&&S.assets.delete) await S.assets.delete(id); return; } const meta=await Store.db.doc('blobs/'+id).get(); const n=meta.exists? (meta.data().parts||1):0; for(let i=0;i<n;i++) await Store.db.doc(`blobs/${id}/parts/${i}`).delete(); await Store.db.doc('blobs/'+id).delete(); }catch(e){ console.warn('blob delete', e); } }
};

const Store = {
  db:null, chains:{}, pending:{}, failed:{}, unsubs:[],
  lget(k){ try{ const v=localStorage.getItem(LSP+k); return v?JSON.parse(v):null; }catch(e){ return null; } },
  lset(k,v){ try{ localStorage.setItem(LSP+k, JSON.stringify(v)); }catch(e){} },
  path(k){ return 'state/'+k; },
  async init(){
    if (window.claude && typeof claude.use==='function'){
      try{ this.db = await claude.use('db'); }catch(e){ this.db=null; }
      if (this.db){ S.mode='db'; S.blobMode='claude'; try{ S.assets = await claude.use('assets'); }catch(e){ S.assets=null; } return S.mode; }
    }
    if (window.FIREBASE_CONFIG && window.__fbReady){
      const FB = await Promise.race([window.__fbReady, sleep(9000).then(()=>null)]);
      S.fb = !!FB;
      const code = Family.code();
      if (FB && code && code!=='LOCAL' && code.length>=10){ try{ this.db = fbAdapter(FB, code); S.mode='db'; S.blobMode='fs'; S.assets = Blobs; }catch(e){ console.warn('firebase init', e); this.db=null; } }
    }
    return S.mode;
  },
  async get(k){
    if (this.db){
      try{ const snap = await this.db.doc(this.path(k)).get(); if (snap.exists){ const d=snap.data(); this.lset(k,d); return JSON.parse(JSON.stringify(d)); } return null; }
      catch(e){ console.warn('db get',k,e); return this.lget(k); }
    }
    return this.lget(k);
  },
  set(k, data){
    this.lset(k, data);
    if (!this.db) return Promise.resolve();
    this.pending[k] = JSON.parse(JSON.stringify(data));
    if (!this.chains[k]) this.chains[k] = this._drain(k);
    return this.chains[k];
  },
  async _drain(k){
    while (this.pending[k]){
      const d = this.pending[k]; this.pending[k]=null;
      try{ await this.db.doc(this.path(k)).set(d); this.failed[k]=false; }
      catch(e){ console.warn('db set',k,e); await sleep(1500); try{ await this.db.doc(this.path(k)).set(d); this.failed[k]=false; }catch(e2){ console.warn('db set retry failed',k); this.failed[k]=true; } }
    }
    this.chains[k]=null;
  },
  subscribe(k, cb){
    if (this.db){
      /* أثناء كتابتنا نحن لهذه الوثيقة يصلنا «صدى» كتابتنا بكائن جديد: نتجاهله، فما في الذاكرة أحدث منه
         (استبدال الكائن كان يُضيّع ما يُعدَّل بعده عبر مراجع قديمة، وقد يُرجع الذاكرة لحالة أقدم إذا تلاحقت الضغطات). */
      const u = this.db.doc(this.path(k)).onSnapshot(snap=>{ if (this.chains[k]) return; if(snap.exists){ const d=JSON.parse(JSON.stringify(snap.data())); this.lset(k,d); cb(d); } else cb(null); }, e=>console.warn('sub',k,e));
      this.unsubs.push(u); return u;
    }
    cb(this.lget(k)); return ()=>{};
  },
  async saveSession(sess){
    const list = this.lget('sessions')||[]; const i=list.findIndex(s=>s.id===sess.id);
    const copy = JSON.parse(JSON.stringify(sess)); if(i>=0) list[i]=copy; else list.unshift(copy); this.lset('sessions', list.slice(0,80));
    if (this.db){ const k='sess_'+sess.id; this.pending[k]=copy; if(!this.chains[k]) this.chains[k]=this._drainSess(sess.id); return this.chains[k]; }
  },
  async _drainSess(id){
    const k='sess_'+id;
    while (this.pending[k]){ const d=this.pending[k]; this.pending[k]=null; try{ await this.db.doc('sessions/'+id).set(d); }catch(e){ console.warn('sess set',e); } }
    this.chains[k]=null;
  },
  async listSessions(n=60){
    if (this.db){ try{ const q = await this.db.collection('sessions').orderBy('start','desc').limit(n).get(); const arr = q.docs.map(d=>d.data()); this.lset('sessions', arr.slice(0,80)); return arr; }catch(e){ console.warn('list sessions',e); } }
    return (this.lget('sessions')||[]).slice().sort((a,b)=>b.start-a.start).slice(0,n);
  }
};

/* ===================== التقدم ===================== */
const Progress = {
  blank(){ return { stars:{}, best:{}, totalStars:0, skills:{}, lastPlayed:0, minutesByDay:{}, reading:[], streak:{last:'',days:0}, lessonsDone:{} }; },
  ensure(){ if(!S.progress) S.progress=this.blank(); for (const k of ['stars','best','skills','minutesByDay','lessonsDone']) if(!S.progress[k]) S.progress[k]={}; if(!S.progress.reading) S.progress.reading=[]; if(!S.progress.streak) S.progress.streak={last:'',days:0}; return S.progress; },
  stars(path){ this.ensure(); return S.progress.stars[path]||0; },
  setStars(path, n, extra){
    this.ensure(); const p=S.progress; const old=p.stars[path]||0; if(n>old) p.stars[path]=n; else if(old===0 && n===0) p.stars[path]=0;
    if (extra && extra.acc!==undefined){ const b=p.best[path]||{}; if(extra.acc>(b.acc||0)) b.acc=extra.acc; if(!b.ms||extra.ms<b.ms) b.ms=extra.ms; b.last=Math.max(b.last||0, extra.at||Date.now()); b.plays=(b.plays||0)+1; p.best[path]=b; }
    p.totalStars = Object.values(p.stars).reduce((a,b)=>a+b,0);
    p.lastPlayed=Date.now(); this.touchStreak();
    return this.save();
  },
  skillLevel(sk){ this.ensure(); return (S.progress.skills[sk]&&S.progress.skills[sk].level)||2; },
  /* ok = إجابات مستقلة فقط؛ help = بمساعدة؛ shown = كُشف الجواب (لا تُحسب إتقانًا) */
  recordSkill(sk, ok, total, help=0, shown=0){
    if(!sk||!total) return; this.ensure(); const s=S.progress.skills[sk]||{ok:0,total:0,level:2,recent:[]};
    s.ok+=ok; s.total+=total; s.help=(s.help||0)+help; s.shown=(s.shown||0)+shown; s.recent=(s.recent||[]).concat([Math.round(100*ok/total)]).slice(-6);
    const acc=ok/total; if(acc>=0.9 && s.level<3) s.level++; else if(acc<0.6 && s.level>1) s.level--;
    S.progress.skills[sk]=s;
  },
  addMinutes(ms){ this.ensure(); const k=dayKey(); S.progress.minutesByDay[k]=Math.round(((S.progress.minutesByDay[k]||0)+ms/60000)*10)/10; },
  touchStreak(){ const st=S.progress.streak; const t=dayKey(); if(st.last===t) return; const y=dayKey(Date.now()-86400000); st.days = st.last===y ? (st.days||0)+1 : 1; st.last=t; },
  save(){ return Store.set('progress', S.progress); }
};

/* ===================== صندوق الأخطاء ===================== */
const Mistakes = {
  ensure(){ if(!S.mistakes) S.mistakes={items:{}}; if(!S.mistakes.items) S.mistakes.items={}; return S.mistakes; },
  key(item){ const base = item.t==='dict'?item.w : item.t==='order'?item.answer : item.t==='syll'?item.w : item.t==='sortone'?item.w : (item.q||'')+(item.say||''); return (item.t+':'+stripT(N(base))).slice(0,120).replace(/[^\p{L}\p{N}:\s]/gu,'').trim(); },
  add(item, skill, src){
    this.ensure(); const k=this.key(item); const it=S.mistakes.items[k]||{item:this.slim(item), skill, src, count:0, streak:0, ts:0};
    it.count++; it.streak=0; it.ts=Date.now(); it.skill=skill||it.skill; it.src=src||it.src; S.mistakes.items[k]=it; return Store.set('mistakes', S.mistakes);
  },
  slim(item){ const o={}; for(const k of ['t','q','opts','a','say','words','answer','w','syl','baskets','b','mode','emoji','skill']) if(item[k]!==undefined) o[k]=item[k]; return o; },
  correct(item){
    this.ensure(); const k=this.key(item); const it=S.mistakes.items[k]; if(!it) return;
    it.streak=(it.streak||0)+1; it.ts=Date.now(); if(it.streak>=3) delete S.mistakes.items[k]; return Store.set('mistakes', S.mistakes);
  },
  list(){ this.ensure(); return Object.entries(S.mistakes.items).map(([k,v])=>({key:k,...v})).sort((a,b)=>b.count-a.count || b.ts-a.ts); },
  count(){ this.ensure(); return Object.keys(S.mistakes.items).length; }
};

/* ===================== التسجيل (الجلسات والأحداث) ===================== */
const Log = {
  sess:null, last:0, n:0,
  ensure(){
    const now=Date.now();
    if (!this.sess || now-this.last > 10*60*1000 || this.sess.events.length>700){
      if (this.sess) this.flush();
      this.sess = { id:'s'+now.toString(36), start:now, end:now, day:dayKey(now), child:childName(), events:[], stations:[], minutes:0 };
    }
    this.last=now; return this.sess;
  },
  ev(e){
    const s=this.ensure(); s.events.push(Object.assign({t:Date.now()}, e)); s.end=Date.now();
    if (++this.n % 12 === 0) this.flush();
  },
  station(st){ const s=this.ensure(); s.stations.push(Object.assign({t:Date.now()}, st)); s.end=Date.now(); s.minutes=Math.round((s.stations.reduce((a,b)=>a+(b.ms||0),0))/6000)/10; this.flush(); },
  flush(){ if(!this.sess) return; this.sess.end=Math.max(this.sess.end, Date.now()); return Store.saveSession(this.sess); }
};

  else Log.ev({k:'back'});
});
window.addEventListener('pagehide', ()=>Log.flush());

/* ===================== بيانات الطفلة/الوالد ===================== */
const Child = {
  ensure(){ if(!S.child) S.child={pending:[], notes:[], handwriting:[], recordings:[], works:[], seenMsgs:{}}; for(const k of ['pending','notes','handwriting','recordings','works']) if(!S.child[k]) S.child[k]=[]; if(!S.child.seenMsgs) S.child.seenMsgs={}; return S.child; },
  /* لا يُحذف ما ينتظر تقييم بابا (حتى ١٥٠)؛ المقيَّم القديم هو الذي يُختصر */
  addPending(p){ this.ensure(); S.child.pending.unshift(Object.assign({id:uid(), ts:Date.now(), status:'pending'}, p));
    const L=S.child.pending; if(L.length>60){ const keep=new Set(L.filter(x=>x.status==='pending').slice(0,150).map(x=>x.id)); let room=Math.max(0, 60-keep.size); for(const x of L){ if(!keep.has(x.id) && room>0){ keep.add(x.id); room--; } } S.child.pending=L.filter(x=>keep.has(x.id)); }
    return Store.set('child', S.child); },
  note(text, kind){ this.ensure(); S.child.notes.unshift({id:uid(), ts:Date.now(), text, kind:kind||'note'}); S.child.notes=S.child.notes.slice(0,40); return Store.set('child', S.child); },
  save(){ this.ensure(); return Store.set('child', S.child); }
};
const Parent = {
  ensure(){ if(!S.parent) S.parent={messages:[], mission:null, ratings:{}, taskConfirms:{}, weekPlan:null}; for(const k of ['messages']) if(!S.parent[k]) S.parent[k]=[]; if(!S.parent.ratings) S.parent.ratings={}; if(!S.parent.taskConfirms) S.parent.taskConfirms={}; if(S.parent.weekPlan===undefined) S.parent.weekPlan=null; if(!S.parent.seenNotes) S.parent.seenNotes={}; return S.parent; },
  save(){ this.ensure(); return Store.set('parent', S.parent); }
};
/* ===================== قفل اللعبة من لوحة بابا ===================== */
/* S.parent.lock = {ts, until (0 = حتى يفتحها بابا), msg} — يصل جهاز البنت مع وثيقة بابا خلال ثوانٍ.
   الشاشات كلها تُحجب بشاشة «اللعبة مقفلة» (render)، ومن كانت داخل محطة تكملها أولًا حتى لا يضيع شغلها ثم تُقفل. */
const Lock = {
  timer:null, shown:false, warned:0,
  get(){ const l=S.parent && S.parent.lock; if (!l || !l.ts) return null; if (l.until && Date.now()>=l.until) return null; return l; },
  on(){ return !!this.get(); },
  /* يحجب شاشات اللعب فقط: لا يحجب لوحة بابا ولا الإعداد الأول */
  blocks(){ return !PARENT_ONLY && S.screen!=='parent' && S.screen!=='setup' && this.on(); },
  /* يُستدعى عند تغيّر وثيقة بابا، وعند انتهاء مدة القفل، وعند رجوع الصفحة للواجهة */
  sync(){
    clearTimeout(this.timer); this.timer=null;
    const l=this.get();
    if (l && l.until) this.timer=setTimeout(()=>this.sync(), Math.min(Math.max(l.until-Date.now(),0)+400, 2147000000));
    if (PARENT_ONLY || S.screen==='parent' || S.screen==='setup') return;
    if (l){
      if (document.querySelector('.game')){ if (this.warned!==l.ts){ this.warned=l.ts; toast('🔒 أَكْمِلِي هَذِهِ الْمَحَطَّةَ، ثُمَّ نَتَوَقَّفُ.', 5000); } }
      else if (!this.shown) render();
    } else if (this.shown) render();
  }
};

/* تطبيق تقييمات بابا القادمة من اللوحة على تقدم الطفلة (الكاتب الوحيد للتقدم هو جهاز الطفلة) */
/* وقت الإنجاز = وقت إرسالها (at) لا وقت التقييم، حتى لا تنطفئ لمبة اليوم بعمل أمس */
async function applyParentRatings(){
  if(!S.parent || !S.child) return; Parent.ensure(); Child.ensure();
  let changed=false, prog=false;
  for (const p of S.child.pending){
    const r = S.parent.ratings[p.id];
    if (r && p.status==='pending'){
      p.status='rated'; p.rating=r.rating; p.ratedAt=r.ts; changed=true;
      if (p.station){ Progress.setStars(p.station, r.rating, {acc:r.rating/3, ms:p.ms||0, at:p.ts}); prog=true; Log.ev({k:'rated_by_parent', s:p.station, rating:r.rating}); }
      /* المهارات التي تُقاس بالكتابة المستقلة أو القراءة المسجّلة: تقييم بابا هو القياس */
      const sk = p.skill || (p.type==='read' ? 'read' : p.type==='nasheed' ? 'nasheed' : '');
      if (sk){ Progress.recordSkill(sk, r.rating===3?1:0, 1, r.rating===2?1:0, r.rating<=1?1:0); prog=true; }
    }
    const tc = p.task && S.parent.taskConfirms[p.id];
    if (tc && p.status==='pending'){ p.status='rated'; p.rating=3; changed=true; if(p.station){ Progress.setStars(p.station,3,{acc:1,ms:0,at:p.ts}); prog=true; } }
  }
  if (applyParentDeletes()) changed=true;
  if (changed) await Child.save();
  if (prog) await Progress.save();
  if (changed && !document.querySelector('.game')) render();
}
/* طلبات الحذف القادمة من لوحة بابا + مدة الاحتفاظ: تُزال من فهارس جهاز الطفلة، والملفات نفسها تُحذف من القاعدة */
function applyParentDeletes(){
  if(!S.child) return false; Child.ensure(); Parent.ensure(); const del=S.parent.deletes||{}; let ch=false;
  const days=(S.settings&&S.settings.retentionDays)||0; const cutoff= days>0 ? Date.now()-days*86400000 : 0; const allBefore=del.__all||0;
  const gone=(id,ts)=> !!del[id] || (cutoff && ts<cutoff) || (allBefore && ts<=allBefore);
  const sweep=(arr, rm)=>{ const keep=[]; for(const x of arr){ if(gone(x.id, x.ts||0)){ ch=true; try{ rm(x); }catch(e){} } else keep.push(x); } return keep; };
  S.child.recordings=sweep(S.child.recordings, x=>Blobs.delete(x.id));
  S.child.handwriting=sweep(S.child.handwriting, x=>Blobs.delete(x.id));
  S.child.works=sweep(S.child.works, x=>Works.remove(x.id));
  for(const p of S.child.pending){ if(p.audio && (del[p.audio] || (cutoff && p.ts<cutoff) || (allBefore && p.ts<=allBefore))){ p.audio=null; ch=true; } if(p.ink && (del[p.ink] || (allBefore && p.ts<=allBefore))){ p.inkGone=true; if(p.status==='pending'){ p.status='removed'; } ch=true; del[p.ink]&&0; }
    if(p.parts) for(const q of p.parts){ if(q.audio && (del[q.audio] || (cutoff && p.ts<cutoff) || (allBefore && p.ts<=allBefore))){ q.audio=null; ch=true; } if(q.ink && !q.inkGone && (del[q.ink] || (allBefore && p.ts<=allBefore))){ q.inkGone=true; ch=true; } } }
  return ch;
}

/* ===================== النجوم والدقة ===================== */
function starsFromAcc(acc){ return acc>=0.9?3 : acc>=0.65?2 : 1; }
function levelOpts(opts, a, level){
  // يقلّل الخيارات حسب المستوى: مستوى 1 خياران، مستوى 2 و3 كل الخيارات
  const correct=opts[a]; let others=opts.filter((_,i)=>i!==a);
  if(level<=1) others=others.slice(0,1);
  const all=shuffle([correct,...others]); return {opts:all, a:all.indexOf(correct)};
}

/* ===================== الكتاب: الصفحات والمصادر ===================== */
const AR_DIGITS='٠١٢٣٤٥٦٧٨٩';
const toAr = n => String(n).replace(/\d/g, d=>AR_DIGITS[d]);
function pageNum(p){ const m=String(p||'').match(/[٠-٩]+/); return m? parseInt(Array.from(m[0]).map(c=>AR_DIGITS.indexOf(c)).join(''),10) : 9999; }
function pageLast(p){ const all=Array.from(String(p||'').matchAll(/[٠-٩]+/g)).map(m=>pageNum(m[0])); return all.length? Math.max(...all) : 9999; }
function lessonRange(key){ const L=BOOK.lessons[key]; if(!L) return null; return `${toAr(pageNum(L.read))}–${toAr(pageLast(L.hw||L.express))}`; }
/* رقم/نطاق صفحة أي مسار في اللعبة (أو null إن لم يكن في الكتاب) */
function pageOf(path){
  { const kp=kPage(path); if (kp!==undefined) return kp; if (kIsX(path)) return null; }
  const [a,b,c]=String(path||'').split('/');
  const L=BOOK.lessons[a]; if(L) return b? (L[b]||null) : lessonRange(a);
  const U=BOOK.units[a]; if(U){ if(!b) return U.range; if(b==='task'){ if(c==='project') return U.project||null; if(c==='family') return U.family||null; return null; } return U[b]||null; }
  if(a==='intro') return b? (BOOK.intro[b]||null) : BOOK.introRange;
  if(a==='lib') return b? (BOOK.library[b]||null) : BOOK.library.range;
  return null;
}
function pageLabel(p){ if(!p) return null; const range=/[–و]/.test(p); return `${range?'الصَّفَحَات':'صَفْحَة'} ${p} فِي الْكِتَابِ`; }
const EXTRA_SRC='نَشَاطٌ إِضَافِيٌّ مِنَ اللُّعْبَةِ، لَيْسَ فِي الْكِتَابِ';
/* سطر المصدر الكامل لأي مسار */
function srcOf(path){
  const [a]=String(path||'').split('/');
  if(a==='review') return 'أَسْئِلَةٌ مِنْ كُلِّ صَفَحَاتِ الْكِتَابِ الَّتِي لَعِبْتِهَا';
  const p=pageOf(path); return p? pageLabel(p) : EXTRA_SRC;
}

/* ===================== لمبة درس اليوم ===================== */
function todayTargets(){
  const wp=effectivePlan(); if(!wp||!wp.days) return [];
  const dk=todayPlanKey(); if(dk==='fri'||dk==='sat') return [];
  return (wp.days[dk]||[]).map(it=>kPlanPath(it.path)).filter(Boolean);
}
function unitOfPath(p){ const a=p.split('/')[0]; if(BOOK.units[a]) return a; const f=findLesson(a); return f? f.unit.key : null; }
/* حالة اللمبة لعنصر: 'on' (درس اليوم ولم يُنجز)، 'done' (أُنجز اليوم)، null */
function lampState(prefix, {parentOk=false}={}){
  const ts=todayTargets(); if(!ts.length) return null;
  const isUnit = /^u\d$/.test(prefix);
  const hits=ts.filter(p=> p===prefix || p.startsWith(prefix+'/') || (isUnit && unitOfPath(p)===prefix) || (parentOk && prefix.startsWith(p+'/')));
  if(!hits.length) return null;
  return hits.every(planDoneToday) ? 'done' : 'on';
}
function lampEl(state, {small=false}={}){
  if(!state) return null;
  return h('span',{class:'lamp'+(state==='done'?' off':''), 'aria-label': state==='done'?'أنجزتها اليوم':'درس اليوم'}, state==='done'?'✅':'💡', small? null : h('b',{}, state==='done'?'خَلَصْتِ':'الْيَوْمَ'));
}
/* يضيف اللمبة والإطار المضيء لعنصر خريطة */

}

/* ===================== مشغّل العناصر العام ===================== */
/* item: {t:'mcq'|'order'|'dict'|'syll'|'sortone', ...}  ctx:{g, level, hint, autoSay, review} */
function runItem(item, ctx){
  return new Promise(resolve=>{
    const g=ctx.g, body=g.body, foot=g.foot; body.replaceChildren(); foot.replaceChildren();
    if (ctx.footExtra) foot.append(ctx.footExtra());
    const t0=Date.now(); let tries=0, hint=0, done=false;
    const fin=(ok, extra)=>{ if(done) return; done=true; g.abortCurrent=null; resolve(Object.assign({ok, tries, hint, ms:Date.now()-t0}, extra||{})); };
    g.abortCurrent=r=>{ if(!done){ done=true; resolve(r); } };
    const fb=h('div',{class:'feedback info'},'');
    const speakBtn=(txt,label)=>{ const b=h('button',{class:'btn btn-sm', onclick:()=>{ Log.ev({k:'tts', txt:stripT(N(txt)).slice(0,40)}); Say.speakUI(b, txt); }}, label||'🔊 اسْمَعِي'); return b; };

    /* ---------- تعبير شفهي: تقول الجملة بصوت عالٍ ثم تضغط ---------- */
    if (item.t==='oral'){
      const prompt=h('div',{class:'prompt oral'}, h('span',{class:'emoji'}, item.emoji||'🗣️'), N(item.q));
      (async()=>{
        const r=await recorderUI(g,{title:'🎙️ سَجِّلِي جَوَابَكِ بِصَوْتٍ عَالٍ', hint:'فَكِّرِي، ثُمَّ اضْغَطِي 🎙️ وَتَكَلَّمِي. اسْمَعِي نَفْسَكِ، وَأَعِيدِي إِذَا أَرَدْتِ، ثُمَّ أَرْسِلِي لِبَابَا.', sendLabel:'📨 أَرْسِلِي لِبَابَا', skipLabel:'🗣️ قُلْتُهَا بِدُونِ تَسْجِيلٍ', extra:prompt});
        if (r && r.aborted){ if(!done){ done=true; resolve(r); } return; }
        if (r && r.rec){ const up=await Rec.save(r.rec,{path:ctx.path, kind:'oral', text:stripT(N(item.q)).slice(0,80)}); if(!up) toast('حُفِظَ الْجَوَابُ، لَكِنْ مَا قَدَرْتُ أَرْفَعُ الصَّوْتَ'); fin(true,{ans: up? '🎙️ سجّلت جوابها' : 'قالتها (بدون رفع)'}); }
        else fin(true,{ans:'قالتها بدون تسجيل'});
      })();
      return;
    }

    /* ---------- اختيار من متعدد ---------- */
    if (item.t==='mcq' || item.t==='sortone'){
      const isSort = item.t==='sortone';
      const srcOpts = isSort ? item.baskets.map(b=>b.label) : item.opts;
      const srcA = isSort ? item.baskets.findIndex(b=>b.id===item.b) : item.a;
      const {opts, a} = levelOpts(srcOpts, srcA, ctx.level||2);
      const prompt = h('div',{class:'prompt'},
        item.emoji? h('span',{class:'emoji'}, item.emoji):null,
        isSort? h('span',{style:'font-size:2rem'}, item.w) : N(item.q),
        item.say && !isSort ? h('span',{class:'tip'},'اضْغَطِي 🔊 لِتَسْمَعِي الْكَلِمَةَ'):null);
      const say = item.say || (isSort? item.w : null);
      const optsEl=h('div',{class:'opts'+(opts.every(o=>stripT(o).length<=14)&&opts.length%2===0?' two':'')});
      const btns=opts.map((o,i)=>h('button',{class:'opt', onclick:()=>choose(i)}, N(o)));
      optsEl.append(...btns);
      body.append(...kids(prompt, say? h('div',{class:'row center'}, speakBtn(say)) : null, optsEl, fb));
      if (say && ctx.autoSay!==false){ setTimeout(()=>Say.speak(say), 150); }
      function choose(i){
        if(done) return;
        if(i===a){ btns[i].classList.add('ok'); btns.forEach((b,j)=>{ if(j!==i) b.classList.add('dim'); }); fb.className='feedback ok'; fb.textContent= tries===0?'أَحْسَنْتِ! 🌟':'صَحِيح! 👏'; setTimeout(()=>fin(tries===0, {ans:opts[i]}), 750); return; }
        tries++; btns[i].classList.add('bad','dim'); Log.ev({k:'try', s:g.path||'', it:stripT(N(item.q||'')).slice(0,50), ans:stripT(N(opts[i])).slice(0,40)});
        if(tries>=2){ btns[a].classList.add('ok'); fb.className='feedback bad'; fb.textContent='الْإِجَابَةُ الصَّحِيحَةُ: '+N(opts[a]); btns.forEach(b=>b.classList.add('dim')); setTimeout(()=>fin(false,{ans:opts[i]}), 1700); return; }
        fb.className='feedback bad'; fb.replaceChildren('جَرِّبِي مَرَّةً ثَانِيَةً 💪 ');
        if (ctx.hint && item.ev!==undefined){ fb.append(h('button',{class:'btn btn-sm', onclick:()=>{ hint++; Log.ev({k:'hint', it:stripT(N(item.q)).slice(0,40)}); ctx.hint(item); }},'🔎 أَيْنَ الْجَوَابُ فِي الْقِصَّةِ؟')); }
      }
      return;
    }

    /* ---------- ترتيب (كلمات/مقاطع) ---------- */
    if (item.t==='order' || item.t==='syll'){
      const target = item.t==='syll' ? item.syl.slice() : item.words.map(w=>N(w));
      const answerStr = item.t==='syll' ? target.join('') : (item.answer? N(item.answer) : target.join(' '));
      let pool = target.slice();
      if (item.t==='syll' && (ctx.level||2)>=3 && item.distractor) pool.push(item.distractor);
      let tiles = shuffle(pool); if (tiles.join('|')===pool.join('|') && pool.length>1) tiles=tiles.slice(1).concat(tiles[0]);
      const placed=[];
      const prompt=h('div',{class:'prompt'}, item.t==='syll'? h('span',{},'رَكِّبِي الْكَلِمَةَ مِنَ الْمَقَاطِعِ:') : N(item.q||'رَتِّبِي الْكَلِمَاتِ:'));
      const row=h('div',{class:'answer-row'});
      const tilesEl=h('div',{class:'tiles'});
      const tileBtns=tiles.map((w,i)=>h('button',{class:'tile', onclick:()=>{ if(done||tileBtns[i].classList.contains('used')) return; tileBtns[i].classList.add('used'); placed.push({w,i}); draw(); if(placed.length===target.length) check(); }}, w));
      tilesEl.append(...tileBtns);
      function draw(){ row.className='answer-row'; row.replaceChildren(...placed.map((p,k)=>h('button',{class:'tile', onclick:()=>{ if(done) return; placed.splice(k,1); tileBtns[p.i].classList.remove('used'); draw(); }}, p.w))); }
      function check(){
        const got = item.t==='syll' ? placed.map(p=>p.w).join('') : placed.map(p=>p.w).join(' ');
        const norm=s=>s.replace(/\s+/g,' ').trim();
        if (norm(got)===norm(answerStr) || (item.t==='syll' && stripT(got)===stripT(answerStr))){ row.classList.add('ok'); fb.className='feedback ok'; fb.textContent= tries===0?'رَائِع! 🌟':'صَحِيح! 👏'; if(item.t==='syll') Say.speak(item.w); setTimeout(()=>fin(tries===0,{ans:got}),900); return; }
        tries++; row.classList.add('bad'); fb.className='feedback bad'; Log.ev({k:'try', s:g.path||'', it:stripT(N(item.w||item.q||'')).slice(0,50), ans:stripT(got).slice(0,40)});
        if(tries>=2){ fb.textContent='الصَّحِيح: '+answerStr; placed.length=0; target.forEach(w=>{ const i=tiles.indexOf(w); placed.push({w,i:i>=0?i:0}); }); draw(); row.classList.add('ok'); setTimeout(()=>fin(false,{ans:got}),2000); return; }
        fb.textContent='التَّرْتِيبُ غَيْرُ صَحِيحٍ، جَرِّبِي مَرَّةً ثَانِيَةً 💪';
        setTimeout(()=>{ placed.length=0; tileBtns.forEach(b=>b.classList.remove('used')); draw(); }, 700);
      }
      body.append(...kids(prompt, item.t==='syll'? h('div',{class:'row center'}, speakBtn(item.w)) : null, row, tilesEl, fb));
      if(item.t==='syll' && ctx.autoSay!==false) setTimeout(()=>Say.speak(item.w),150);
      draw(); return;
    }

    /* ---------- الإملاء ---------- */
    if (item.t==='dict'){
      const word=item.w; const bare=stripT(word); const letters=Array.from(bare);
      const level=ctx.level||2; const nDis = level===1?1: level===2?2:3;
      const POOL='ابتثجحخدذرزسشصضطظعغفقكلمنهوي'; const dis=pick(Array.from(POOL).filter(c=>!letters.includes(c)), nDis);
      const tiles=shuffle(letters.concat(dis));
      const mode=item.mode||'copy'; const flashMs = level===1?6000: level===2?4500:3000;
      const modeTxt = {copy:'👀 انْظُرِي إِلَى الْكَلِمَةِ، ثُمَّ اضْغَطِي حُرُوفَهَا بِالتَّرْتِيبِ.', flash:'👀 انْظُرِي جَيِّدًا... سَتَخْتَفِي الْكَلِمَةُ بَعْدَ قَلِيلٍ!', hidden:'👂 اسْمَعِي الْكَلِمَةَ، ثُمَّ اضْغَطِي حُرُوفَهَا بِالتَّرْتِيبِ.'}[mode];
      const wordEl=h('span',{}, mode==='hidden'? '🔊 ❓' : word);
      const shown=h('div',{class:'prompt', style:'font-size:2.2rem'}, item.emoji? h('span',{class:'emoji'}, item.emoji):null, wordEl);
      const build=h('div',{class:'word-build'},'');
      let typed=[];
      const tilesEl=h('div',{class:'tiles'});
      const tileBtns=tiles.map((c,i)=>h('button',{class:'tile letter', onclick:()=>{ if(done||tileBtns[i].classList.contains('used')) return; tileBtns[i].classList.add('used'); typed.push({c,i}); draw(); if(typed.length===letters.length) setTimeout(check,250); }}, c));
      tilesEl.append(...tileBtns);
      const undo=h('button',{class:'btn btn-sm', onclick:()=>{ if(done||!typed.length) return; const p=typed.pop(); tileBtns[p.i].classList.remove('used'); draw(); }},'↩ امْسَحِي حَرْفًا');
      function draw(){ build.className='word-build'; build.textContent=typed.map(p=>p.c).join(''); }
      function check(){
        const got=typed.map(p=>p.c).join('');
        if(got===bare){ build.classList.add('ok'); wordEl.textContent=word; fb.className='feedback ok'; fb.textContent= tries===0?'إِمْلَاءٌ صَحِيح! 🌟':'صَحِيح! 👏'; setTimeout(()=>fin(tries===0,{ans:got}),900); return; }
        tries++; build.classList.add('bad'); fb.className='feedback bad'; Log.ev({k:'try', s:g.path||'', it:stripT(word).slice(0,50), ans:got.slice(0,40)});
        if(tries>=2){ wordEl.textContent=word; build.textContent=bare; build.classList.remove('bad'); build.classList.add('ok'); fb.textContent='الْكَلِمَةُ الصَّحِيحَةُ: '+word; setTimeout(()=>fin(false,{ans:got}),2000); return; }
        fb.textContent='فِيهَا خَطَأ، اسْمَعِيهَا مَرَّةً ثَانِيَةً وَجَرِّبِي 💪'; Say.speak(word);
        setTimeout(()=>{ typed=[]; tileBtns.forEach(b=>b.classList.remove('used')); draw(); }, 800);
      }
      body.append(h('div',{class:'card sand small'}, modeTxt), shown, h('div',{class:'row center'}, speakBtn(word), undo), build, tilesEl, fb);
      if (ctx.autoSay!==false) setTimeout(()=>Say.speak(word),150);
      if (mode==='flash'){ setTimeout(()=>{ if(!done && !build.classList.contains('ok')) wordEl.textContent='🔊 ❓'; }, flashMs); }
      draw(); return;
    }
    fin(true);
  });
}

/* ===================== تشغيل مجموعة عناصر ===================== */
async function runItems(items, ctx){
  const g=ctx.g; const results=[]; const t0=Date.now();
  for (let i=0;i<items.length;i++){
    if (g.aborted) return {aborted:true};
    g.setDots(items.length, i, results);
    const item=items[i]; const skill=item.skill||ctx.skill;
    /* سطر المصدر لكل جزء: صفحة العنصر إن وُجدت، وإلا صفحة المحطة */
    if (item.page) g.setSrc(pageLabel(item.page)); else if (ctx.path) g.setSrc(ctx.path);
    const level = ctx.level || Progress.skillLevel(skill);
    g.cur={i:i+1, n:items.length, it:stripT(N(item.q||item.w||item.answer||'')).slice(0,50)};
    const r = await runItem(item, {g, level, hint:ctx.hint, autoSay:ctx.autoSay, footExtra:ctx.footExtra});
    if (r.aborted) return {aborted:true};
    results.push(r);
    /* نوع الإجابة: مستقلة (من أول محاولة بلا مساعدة) / بمساعدة (بعد خطأ أو تلميح أو في تدريب فيه الحروف أو الكلمات جاهزة) / كُشف الجواب */
    r.mode = item.t==='oral' ? 'rec' : (r.tries>=2 && !r.ok) ? 'shown' : (!r.ok || r.hint>0 || ctx.practice || item.mode==='copy' || item.mode==='flash') ? 'help' : 'ind';
    if (r.mode!=='ind' && r.mode!=='rec' && r.hint>0) r.ok=false;
    Log.ev({k:'answer', s:ctx.path, skill, it:stripT(N(item.q||item.w||item.answer||'')).slice(0,50), ans:stripT(N(String(r.ans||''))).slice(0,40), ok:r.ok, mode:r.mode, tries:r.tries, hint:r.hint, ms:r.ms});
    if (!r.ok && !ctx.review && item.t!=='sortone') Mistakes.add(item, skill, ctx.path);
    if (ctx.review){ if(r.ok) Mistakes.correct(item); else Mistakes.add(item, skill, ctx.path); }
    if (!r.ok && ctx.perSkill) { /* نتابع المهارات المختلفة داخل المحطة */ }
    if (r.mode!=='rec'){ ctx.skillTally = ctx.skillTally||{}; const st=ctx.skillTally[skill]||{ok:0,total:0,help:0,shown:0}; st.total++; if(r.mode==='ind') st.ok++; else if(r.mode==='help') st.help++; else st.shown++; ctx.skillTally[skill]=st; }
  }
  g.setDots(items.length, items.length, results); g.cur=null;
  const ok=results.filter(r=>r.ok).length;
  return {ok, total:results.length, acc: results.length? ok/results.length : 1, ms:Date.now()-t0, results, skillTally:ctx.skillTally||{}};
}

/* ===================== إنهاء محطة وشاشة النتيجة ===================== */
async function finishStation(g, info){
  // info: {path, skill, acc, ms, stars, pending, skillTally, label, next}
  const stars = info.stars!==undefined ? info.stars : starsFromAcc(info.acc);
  if (info.skillTally) for (const [sk,v] of Object.entries(info.skillTally)) Progress.recordSkill(sk, v.ok, v.total, v.help||0, v.shown||0);
  else if (info.skill && info.total) Progress.recordSkill(info.skill, Math.round(info.acc*info.total), info.total);
  Progress.addMinutes(info.ms||0);
  if (!info.pending) await Progress.setStars(info.path, stars, {acc:info.acc, ms:info.ms});
  else await Progress.save();
  Log.station({s:info.path, stars: info.pending?0:stars, acc: Math.round((info.acc||0)*100), ms:info.ms, pending:!!info.pending, extra:info.extra||null}); g.done=true; g.cur=null;
  if (stars===3 && !info.pending && !info.simple) confettiBurst();
  const msgs = info.pending ? (info.pendingMsgs || ['أَرْسَلْتُ النَّتِيجَةَ لِبَابَا 📨','بَابَا سَيَسْمَعُكِ وَيُعْطِيكِ النُّجُومَ.']) :
    info.simple ? ['تَمَام! 👍','نُكْمِلُ الرِّحْلَةَ 🚀'] :
    stars===3 ? ['مُمْتَازَة! 🌟🌟🌟', 'نَخْلَتُكِ كَبُرَتْ! 🌴'] : stars===2 ? ['أَحْسَنْتِ! 🌟🌟','بَقِيَ الْقَلِيلُ لِلنَّجْمَةِ الثَّالِثَةِ!'] : ['أَكْمَلْتِ اللُّعْبَةَ 🌟','كُلَّمَا لَعِبْتِ أَكْثَرَ صَارَ أَسْهَلَ! 💪'];
  return new Promise(res=>{
    g.body.replaceChildren(h('div',{class:'result'},
      h('div',{class:'hero', style:'justify-content:center'}, h('div',{class:'mascot', html:MASCOT_HTML})),
      h('div',{class:'big-stars'}, info.pending? '⏳' : info.simple? '✅' : starsTxt(stars)),
      h('h2',{}, msgs[0]), h('p',{class:'small'}, msgs[1]),
      !info.pending && !info.simple ? h('p',{class:'small'}, `⏱️ الْوَقْتُ: ${fmtMs(info.ms||0)}`) : null
    ));
    g.setDots(0,0,[]);
    g.foot.replaceChildren(...kids(
      info.next ? h('button',{class:'btn btn-primary', onclick:()=>res('next')}, info.next) : null,
      h('button',{class:'btn', onclick:()=>res('back')}, 'الْعَوْدَةُ لِلْخَرِيطَةِ 🗺️')
    ));
  });
}
